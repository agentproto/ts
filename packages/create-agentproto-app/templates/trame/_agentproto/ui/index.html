<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>__APP_NAME__</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a;
    --ink: #e7e9ee; --muted: #9aa3b2; --accent: #6ea8fe; --bad: #e06c6c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); }
  header { padding: 14px 18px; border-bottom: 1px solid var(--line);
           display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.error { color: var(--bad); }
  .board { padding: 40px 24px; text-align: center; color: var(--muted); }
  .board h2 { color: var(--ink); font-size: 18px; margin-bottom: 6px; }
</style>
</head>
<body>
<header>
  <h1>__APP_NAME__</h1>
  <span id="status">connecting…</span>
</header>
<div class="board" id="stage-board">
  <h2>Stage board</h2>
  <p>Empty — wire this board to the app state ledger
     (<code>app_state_list</code> / <code>app_state_get</code>) and the data
     plane (<code>app_data_read</code>) via the bridge once the app has real
     stages to render.</p>
</div>
<script>
// ---- window.McpApp bridge (defensive: standalone-safe) ----
// The host (`agentproto app serve`, an MCP-Apps panel) injects
// window.McpApp. When absent (file:// preview, plain tab), the page stays
// renderable and says so instead of throwing.
(function () {
  var status = document.getElementById("status");
  if (!window.McpApp || typeof window.McpApp.connect !== "function") {
    status.textContent = "standalone (no host bridge)";
    return;
  }
  window.McpApp.connect().then(function (bridge) {
    status.textContent = "connected";
    // bridge.callTool(name, args) — drive the stage board here.
  }).catch(function (e) {
    status.textContent = "standalone: " + (e && e.message ? e.message : e);
    status.className = "error";
  });
})();
</script>
</body>
</html>
