<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>__APP_NAME__</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --bg2: #161b22; --border: #30363d;
  --text: #e6edf3; --text2: #8b949e; --blue: #58a6ff;
}
html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; background: var(--bg); color: var(--text); }
#app { display: flex; flex-direction: column; height: 100%; }
#toolbar { padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
#toolbar .title { font-size: 13px; font-weight: 600; }
#content { padding: 14px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.abtn { background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-family: inherit; align-self: flex-start; }
.abtn:hover { background: var(--border); }
.abtn:disabled { opacity: .4; cursor: default; }
#output { white-space: pre-wrap; word-break: break-word; background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 8px; font-family: Menlo, Monaco, monospace; font-size: 12px; }
#status { padding: 6px 14px; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); background: var(--bg2); flex-shrink: 0; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar"><span class="title">__APP_NAME__</span></div>
  <div id="content">
    <button class="abtn" id="run-btn">Run workflow</button>
    <pre id="output">Not run yet.</pre>
  </div>
  <div id="status">Connecting&hellip;</div>
</div>
<script>
var APP_ID = "__APP_ID__";
var callTool = null;

function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function setOutput(text) {
  document.getElementById("output").textContent = text;
}

function callApp(tool, args) {
  if (!callTool) return Promise.reject(new Error("Not connected to host bridge (standalone mode)."));
  return callTool("app_tool_call", { appId: APP_ID, tool: tool, args: args || {} });
}

function runWorkflow() {
  var btn = document.getElementById("run-btn");
  btn.disabled = true;
  setStatus("Running…");
  callApp("app_run", { appId: APP_ID, prompt: "Say hello and describe what you can do." })
    .then(function (run) {
      setOutput(JSON.stringify(run, null, 2));
      setStatus("Ready");
    })
    .catch(function (err) {
      setOutput("Error: " + err.message);
      setStatus("Ready");
    })
    .then(function () {
      btn.disabled = false;
    });
}

document.getElementById("run-btn").addEventListener("click", runWorkflow);

// Every host (a served app UI or an installed MCP-Apps panel) injects
// window.AgentprotoUI alongside window.McpApp, so a harness/model picker is
// available with no extra wiring. Uncomment to let the user pick which
// installed harness (+ optional model) app_run below spawns through:
//
//   var runner = window.AgentprotoUI.mountRunnerSelect(
//     document.getElementById("content"),
//     { callTool: function (tool, args) { return callApp(tool, args); } },
//   );
//
// Then spread runner.getRunner() (= { harness, model? }) into the app_run
// call in runWorkflow() above, e.g.:
//   callApp("app_run", Object.assign({ appId: APP_ID, prompt: "..." }, runner.getRunner()))

(window.McpApp ? window.McpApp.connect() : Promise.reject(new Error("window.McpApp bridge missing")))
  .then(function (bridge) {
    callTool = bridge.callTool;
    setStatus("Ready");
  })
  .catch(function (err) {
    setStatus("Standalone mode — no host bridge (" + err.message + ")");
  });
</script>
</body>
</html>
