# agentproto-workstation e2b template build declaration.
#
# The pins live in versions.json (single source of truth) and are baked into
# the Dockerfile's ARG DEFAULTS by the generator — the e2b CLI has NO
# --build-arg (`template build` is deprecated; use `e2b template create`),
# so the values below are a human-readable RECORD of what the Dockerfile
# bakes, not arguments passed at build time. This file only names the
# template by its ALIAS — the opaque e2b template id is never hardcoded here.
#
# NOTE: this file is regenerated by `node scripts/sync-templates.mjs`.
# Edit versions.json (or the generator), never this file.

template_id = "agentproto-workstation"

description = "agentproto workstation — Node, git, pinned @agentproto/cli, baked agentproto adapters, and the OpenCode runtime"

# Sandbox runtime resources of the bare alias = the default size preset
# (versions.json → sizes.large). The e2b default is
# 512MB, which OOMs a heavy adapter install (e.g. mastra) — so bump both. NOTE:
# `e2b template create -d Dockerfile` does NOT read this file; these MUST be
# passed as CLI flags (`--cpu-count` / `--memory-mb`) at create time — see the
# build commands below and README.md. The keys here are a human-readable RECORD.
cpu_count = 4
memory_mb = 8192

[build]
dockerfile = "Dockerfile"

# Pins baked into the Dockerfile ARG defaults (versions.json is the source).
# One entry PER PACKAGE — never a space-separated list: E2B rewrites each ARG
# into an ENV and mangles spaces in ENV values (verified live).
[build.args]
BASE_IMAGE = "e2bdev/code-interpreter:latest"
AGENTPROTO_CLI_VERSION = "1.20.0"
AGENTPROTO_ADAPTER_HERMES = "@agentproto/adapter-hermes@0.4.38"
AGENTPROTO_ADAPTER_MASTRA_AGENT = "@agentproto/adapter-mastra-agent@0.7.33"
AGENTPROTO_ADAPTER_OPENCODE = "@agentproto/adapter-opencode@1.8.2"
OPENCODE_RUNTIME_VERSION = "1.19.0"
GH_VERSION = "2.102.0"
GH_SHA256 = "bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386"

# Build (from templates/workstation/ — see README.md). The resource flags are
# REQUIRED — the toml keys above are ignored by `template create`.
# Bare alias (= default size large):
#   e2b template create agentproto-workstation --cpu-count 4 --memory-mb 8192 -d Dockerfile
# Dev variant (same Dockerfile, different alias, default size):
#   e2b template create agentproto-workstation-dev --cpu-count 4 --memory-mb 8192 -d Dockerfile
# One template per size preset (`config.size` in a sandbox spec):
#   e2b template create agentproto-workstation-nano --cpu-count 1 --memory-mb 1024 -d Dockerfile
#   e2b template create agentproto-workstation-small --cpu-count 2 --memory-mb 2048 -d Dockerfile
#   e2b template create agentproto-workstation-medium --cpu-count 2 --memory-mb 4096 -d Dockerfile
#   e2b template create agentproto-workstation-large --cpu-count 4 --memory-mb 8192 -d Dockerfile
#   (unavailable — e2b refused: 400: Memory can't be higher than 8192 MiB (if you need to increase this limit, please contact support))
#   e2b template create agentproto-workstation-x-large --cpu-count 8 --memory-mb 16384 -d Dockerfile
#   (unavailable — e2b refused: 400: CPU count can't be higher than 8 (if you need to increase this limit, please contact support))
#   e2b template create agentproto-workstation-xx-large --cpu-count 16 --memory-mb 32768 -d Dockerfile
