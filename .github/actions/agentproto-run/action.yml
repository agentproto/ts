name: agentproto-run
description: >
  Generic agentflow lane — boots an `agentproto serve` daemon in the runner,
  drives an arbitrary WORKFLOW.md through it over MCP (`workflow_run_file` /
  `workflow_status` / `workflow_cancel`), and surfaces an honest exit code.
  Additive to, and separate from, the hand-rolled `pr-review` loop in
  `.github/workflows/ci.yml` — this lane exists so a future agentflow can be
  carried without inventing a new bespoke Action per verb.

  `agentproto run` (the one-shot CLI verb) is capped at one adapter session
  dispatching one turn and has no flag for loading a WORKFLOW.md; the
  `workflow_run_file`/`workflow_status` MCP tools that a WORKFLOW.md needs are
  only registered on the daemon (`agentproto serve`), so this action drives
  the daemon over MCP rather than shelling out to `agentproto run`.

  IMPORTANT — composite actions cannot self-impose a job timeout. The
  `timeout-minutes` input only bounds this action's OWN poll loop; the
  CALLING JOB must ALSO set its own `timeout-minutes:` (matching or exceeding
  this input) or GitHub's default 360-minute job timeout — or its own
  shorter default — will kill the runner out from under this action first.

  This action does not check out the repo itself — the calling job must run
  `actions/checkout` before `uses: ./.github/actions/agentproto-run`.

inputs:
  adapter:
    description: Agent adapter slug to spawn (e.g. "claude-code").
    required: true
  workflow-path:
    description: Path to a WORKFLOW.md, relative to `cwd` (or absolute).
    required: true
  workflow-input:
    description: JSON string bound to `$input` in the compiled workflow.
    required: false
    default: '{}'
  cwd:
    description: Working directory for the daemon's workspace AND for spawned agent sessions.
    required: false
    default: ${{ github.workspace }}
  auth-mode:
    description: Billing-auth mode for the adapter — "subscription" or "api-key".
    required: false
    default: subscription
  oauth-token:
    description: Subscription bearer token (secrets.CLAUDE_CODE_OAUTH_TOKEN). Required when auth-mode=subscription.
    required: false
    default: ''
  api-key:
    description: Provider API key (secrets.ANTHROPIC_API_KEY). Required when auth-mode=api-key.
    required: false
    default: ''
  model:
    description: >
      Optional AIP-45 `model` option for the spawned adapter (e.g.
      "kimi-k2.7-code", "anthropic/claude-sonnet-4-5"). Written to
      `defaults.adapters.<adapter>.options.model` in config.json, which the
      runtime renders to the adapter's `--model <id>` spawn arg. Default '' ⇒
      the adapter's own default model (fully backward compatible).
    required: false
    default: ''
  base-url:
    description: >
      Optional AIP-45 `base_url` option — an Anthropic-compatible gateway
      endpoint (e.g. "https://api.moonshot.ai/anthropic"). Written to
      `defaults.adapters.<adapter>.options.base_url`, which the runtime injects
      as ANTHROPIC_BASE_URL in the adapter subprocess env. Setting it makes the
      spawn a GATEWAY spawn: the runtime skips native billing-auth resolution
      (no ANTHROPIC_* native credential is injected). Default '' ⇒ the default
      Anthropic endpoint.
    required: false
    default: ''
  thinking:
    description: >
      Optional AIP-45 `thinking` boolean option — set to "true" to enable
      extended thinking (adds `--thinking`). Required by thinking-gated gateway
      models such as Moonshot's Kimi, which reject a request without it. Default
      '' ⇒ off (native models pick their own thinking behaviour).
    required: false
    default: ''
  provider-key:
    description: >
      Optional gateway/provider key VALUE (e.g. a Moonshot bearer, a Groq key).
      Injected onto the daemon process env under `provider-key-env` — inherited
      by the adapter subprocess. Pair with `base-url` for a gateway spawn.
      Never interpolated into a shell string; masked with ::add-mask::.
    required: false
    default: ''
  provider-key-env:
    description: >
      Env-var NAME under which `provider-key` is set on the daemon/adapter
      subprocess (e.g. "ANTHROPIC_AUTH_TOKEN" for an Anthropic-compatible
      gateway bearer, or "GROQ_API_KEY"). Only used when `provider-key` is also
      set. Default '' ⇒ no provider key injected.
    required: false
    default: ''
  e2b-api-key:
    description: >
      e2b API key (secrets.E2B_API_KEY). Required when the workflow places an
      agent step in an `e2b` sandbox (`@agentproto/sandbox-e2b` reads
      E2B_API_KEY from the daemon process env). Empty ⇒ an e2b boot fails
      loudly and the workflow step fails (no silent host spawn).
    required: false
    default: ''
  langfuse-public-key:
    description: >
      Langfuse public key (pk-lf-…, secrets.LANGFUSE_PUBLIC_KEY). All of
      public-key + secret-key + base-url must be set to enable session
      tracing on the daemon this action boots; any missing ⇒ tracing is
      skipped silently (never fails the run).
    required: false
    default: ''
  langfuse-secret-key:
    description: Langfuse secret key (sk-lf-…, secrets.LANGFUSE_SECRET_KEY). Masked.
    required: false
    default: ''
  langfuse-base-url:
    description: Langfuse base URL (self-hosted host:port or cloud URL).
    required: false
    default: ''
  langfuse-project:
    description: >
      Informational project label — stamped as the Langfuse `environment` tag
      on traces (sanitized). The project itself is selected by the key pair.
    required: false
    default: ''
  cli-source:
    description: >
      Where to get the agentproto CLI from: "npm" installs
      @agentproto/cli@cli-version into the action's own node_modules;
      "workspace" uses the already-built repo CLI at
      <cwd>/packages/cli/dist/cli.mjs (caller must build it first).
    required: false
    default: npm
  cli-version:
    description: Pinned @agentproto/cli npm version to install and run `agentproto serve` from. Used when cli-source=npm.
    required: false
    default: 0.8.0
  mcp-sdk-version:
    description: Pinned @modelcontextprotocol/sdk npm version for the driver's MCP client (matches this repo's own ^1.29.0 pin).
    required: false
    default: 1.29.0
  adapter-version:
    description: >
      Pinned npm version of @agentproto/adapter-<adapter> (e.g. "1.0.1" for
      claude-code). `agentproto serve` resolves an adapter slug to this
      SEPARATE npm package (@agentproto/cli does not bundle it) — verified by
      running the daemon against an installed-but-adapter-less CLI, which
      fails with "could not load adapter". Defaults to "latest"; pin
      explicitly once you know the version you want for full reproducibility.
    required: false
    default: latest
  timeout-minutes:
    description: Hard ceiling on the driver's OWN poll loop. The calling job's `timeout-minutes` must independently cover this.
    required: false
    default: '360'

outputs:
  run-id:
    description: The workflow run id returned by `workflow_run_file`.
    value: ${{ steps.run.outputs.run-id }}
  status:
    description: Terminal workflow status — "done", "failed", or "cancelled".
    value: ${{ steps.run.outputs.status }}

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 22
        # This action never runs `pnpm install` (it's standalone-npx-pinned,
        # see the "Install agentproto CLI..." step below) — setup-node's
        # auto-cache would still try to shell out to `pnpm` (detected from
        # this repo's package.json `packageManager` field) to resolve the
        # cache key, and fail with "Unable to locate executable file: pnpm"
        # on a bare runner. Same trap .github/actions/agent-setup/action.yml
        # already documents; verified by hitting it for real on PR #430's
        # own pull_request-triggered smoke run.
        package-manager-cache: false

    - name: Mask credentials (defense-in-depth)
      shell: bash
      env:
        OAUTH_TOKEN: ${{ inputs.oauth-token }}
        API_KEY: ${{ inputs.api-key }}
        PROVIDER_KEY: ${{ inputs.provider-key }}
        E2B_KEY: ${{ inputs.e2b-api-key }}
        LF_SECRET: ${{ inputs.langfuse-secret-key }}
        LF_PUBLIC: ${{ inputs.langfuse-public-key }}
      run: |
        if [ -n "$OAUTH_TOKEN" ]; then echo "::add-mask::$OAUTH_TOKEN"; fi
        if [ -n "$API_KEY" ]; then echo "::add-mask::$API_KEY"; fi
        if [ -n "$PROVIDER_KEY" ]; then echo "::add-mask::$PROVIDER_KEY"; fi
        if [ -n "$E2B_KEY" ]; then echo "::add-mask::$E2B_KEY"; fi
        if [ -n "$LF_SECRET" ]; then echo "::add-mask::$LF_SECRET"; fi
        if [ -n "$LF_PUBLIC" ]; then echo "::add-mask::$LF_PUBLIC"; fi

    - name: Write ~/.agentproto/config.json adapter credentials + options
      shell: bash
      env:
        ADAPTER: ${{ inputs.adapter }}
        AUTH_MODE: ${{ inputs.auth-mode }}
        OAUTH_TOKEN: ${{ inputs.oauth-token }}
        API_KEY: ${{ inputs.api-key }}
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.base-url }}
        THINKING: ${{ inputs.thinking }}
        LANGFUSE_PUBLIC_KEY: ${{ inputs.langfuse-public-key }}
        LANGFUSE_SECRET_KEY: ${{ inputs.langfuse-secret-key }}
        LANGFUSE_BASE_URL: ${{ inputs.langfuse-base-url }}
        LANGFUSE_PROJECT: ${{ inputs.langfuse-project }}
      run: node "${{ github.action_path }}/write-config.mjs"

    - name: Install agentproto CLI + adapter + MCP SDK (pinned npm source)
      shell: bash
      if: inputs.cli-source == 'npm'
      run: |
        npm install --no-save --prefix "${{ github.action_path }}" \
          "@agentproto/cli@${{ inputs.cli-version }}" \
          "@agentproto/adapter-${{ inputs.adapter }}@${{ inputs.adapter-version }}" \
          "@modelcontextprotocol/sdk@${{ inputs.mcp-sdk-version }}"

    # driver.mjs imports @modelcontextprotocol/sdk itself; in workspace mode the
    # CLI comes from the repo build but the driver still needs its own SDK.
    - name: Install driver MCP SDK (workspace source)
      shell: bash
      if: inputs.cli-source == 'workspace'
      run: |
        npm install --no-save --prefix "${{ github.action_path }}" \
          "@modelcontextprotocol/sdk@${{ inputs.mcp-sdk-version }}"

    - name: Boot daemon and drive workflow over MCP
      id: run
      shell: bash
      env:
        ADAPTER: ${{ inputs.adapter }}
        WORKFLOW_PATH: ${{ inputs.workflow-path }}
        WORKFLOW_INPUT: ${{ inputs.workflow-input }}
        RUN_CWD: ${{ inputs.cwd }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        PORT: '18790'
        ACTION_PATH: ${{ github.action_path }}
        CLI_SOURCE: ${{ inputs.cli-source }}
        PROVIDER_KEY: ${{ inputs.provider-key }}
        PROVIDER_KEY_ENV: ${{ inputs.provider-key-env }}
        # Sandbox support. The daemon (a child of this driver) resolves a
        # sandbox spec's `env.passthrough` slugs against ITS OWN process env
        # (serve.ts's resolveSandboxSecret), and @agentproto/sandbox-e2b reads
        # E2B_API_KEY from the same env to boot the microVM. These exports
        # exist for that path only — HOST spawns still authenticate via
        # ~/.agentproto/config.json (write-config.mjs above), never ambient env.
        E2B_API_KEY: ${{ inputs.e2b-api-key }}
        # Gated like ANTHROPIC_AUTH_TOKEN below — a stale ambient OAuth token
        # in api-key mode would shadow the API key for claude-code spawns.
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.auth-mode == 'subscription' && inputs.oauth-token || '' }}
        # claude-sdk's subscription env var — same credential as
        # CLAUDE_CODE_OAUTH_TOKEN, exported under the name the SDK reads so a
        # sandbox spec can passthrough ANTHROPIC_AUTH_TOKEN once a live
        # subscription token exists (the 2026-07 stored token is expired —
        # api-key passthrough is the proven-live recipe today). Gated on
        # auth-mode: an ambient AUTH_TOKEN outranks ANTHROPIC_API_KEY in the
        # Claude CLI, so exporting a stale one in api-key mode would shadow
        # the working key for any host-side claude-sdk spawn.
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.auth-mode == 'subscription' && inputs.oauth-token || '' }}
        ANTHROPIC_API_KEY: ${{ inputs.api-key }}
      run: node "${{ github.action_path }}/driver.mjs"
