name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: # manual recovery trigger if push event is ever skipped
    inputs:
      force_post_release_steps:
        description: >-
          Run the VS Code publish / release notes / docs-check steps against
          the current HEAD even though changesets has nothing new to
          publish. For backfilling those steps after a run where
          changesets/action published fine but died on something after
          (e.g. the tag-push flake reconcile-release-tags.mjs recovers from
          automatically) — a manual escape hatch for the case that recovery
          couldn't cover, not something to reach for routinely.
        type: boolean
        default: false
      agent_backend:
        description: LLM backend for release notes and docs-check.
        type: choice
        default: auto
        options:
          - auto
          - opencode-free
          - claude-cloud

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a release in progress

permissions:
  contents: write # create tags + GitHub releases
  pull-requests: write # open "Version Packages" PR
  statuses: write # stamp "Agentic review" on the Version Packages PR head
  id-token: write # npm provenance attestation

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AGENT_RELEASE_NOTES_PRESETS: ${{ vars.AGENT_RELEASE_NOTES_PRESETS }}
      AGENT_DOCS_CHECK_PRESETS: ${{ vars.AGENT_DOCS_CHECK_PRESETS }}
    steps:
      - name: Checkout (full history for changesets)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # changesets/action does one of two things depending on state:
      #
      # A) Pending changesets exist → opens (or updates) a "Version Packages"
      #    PR that bumps versions + regenerates CHANGELOGs.
      #
      # B) No pending changesets (i.e. the "Version Packages" PR was just
      #    merged) → publishes every package whose version isn't yet on npm
      #    and creates a GitHub release per package.
      # The publish step pushes ~100 git tags back-to-back on a big release,
      # and GitHub's ref-write path has answered HTTP 429 mid-burst
      # (2026-09-29, run 36603549866), failing the step even though the
      # reconcile step below repaired the tags on the next run. We wrap the
      # publish command in a bounded retry (scripts/publish-with-retry.mjs,
      # up to 3 attempts with backoff on transient signatures: HTTP 429,
      # "fatal error in commit_refs", "remote rejected", sideband disconnect).
      # A retry is safe because `changeset publish` is idempotent — it skips
      # versions already on npm — and the reconcile step repairs tags, so a
      # re-run converges instead of double-publishing. Non-transient failures
      # exit immediately with the original exit code.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: node scripts/publish-with-retry.mjs
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN must be a granular access token with "Bypass 2FA"
          # scoped to the @agentproto org. Set it in the repo's Secrets.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets/action drops EVERY per-package changelog from the "Version
      # Packages" PR body once the rendered body crosses GitHub's 65 536-char
      # cap — #1072 (241 files, 60 packages) shipped with bare headings and
      # "omitted … exceeds the size limit", nothing to review. Re-post the
      # full changelog as marker-tagged comments (chunked under the comment
      # cap, updated in place on every run, removed when the body wasn't
      # truncated). continue-on-error: reviewability bonus on top of an
      # already-successful version step, never a red release job.
      - name: Post full changelog on the Version Packages PR
        if: always() && steps.changesets.outputs.pullRequestNumber != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          REPO: ${{ github.repository }}
        run: node scripts/version-pr-changelog.mjs

      # The Version Packages PR is opened by github-actions[bot] with the
      # workflow-scoped GITHUB_TOKEN, so its CI runs sit in "action_required"
      # until a maintainer approves them — and the ruleset on main requires
      # the "Agentic review" status, which only ci.yml's review job posts.
      # Nothing in that PR is reviewable (a generated version bump already
      # built on main; ci.yml skips Build+test for changeset-release/* heads
      # for the same reason), so this workflow, which just ran on main with
      # full permissions, stamps the required status on the PR head itself.
      # Merging the release PR then needs neither "Approve workflows to run"
      # nor a bypass. continue-on-error: a status post must never red a
      # release. Re-runs on every push to main, which is exactly when the
      # bot force-pushes a new head.
      - name: Mark the Version Packages PR as reviewed (generated bump)
        if: always() && steps.changesets.outputs.pullRequestNumber != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHA=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq .headRefOid 2>/dev/null || true)
          if [ -z "$SHA" ]; then
            echo "::warning::could not resolve the head sha of PR #$PR_NUMBER — 'Agentic review' status not posted"
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh api "repos/$REPO/statuses/$SHA" \
                -f context="Agentic review" \
                -f state="success" \
                -f target_url="$RUN_URL" \
                -f description="release PR: generated version bump, already built on main" >/dev/null 2>&1; then
              echo "posted 'Agentic review' = success on $SHA (PR #$PR_NUMBER)"
              exit 0
            fi
            echo "  attempt $attempt/3 failed"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo "::warning::failed to post 'Agentic review' on PR #$PR_NUMBER after 3 attempts — merge it with the ruleset bypass"

      # changesets/action publishes ONLY when no changeset is pending. A
      # changeset that lands on main between the "Version Packages" PR being
      # opened and merged (the automated catalog sync does this constantly:
      # #1731 at 15:45:33, version PR #1730 merged 15:46:43 on 2026-10-06;
      # same shape the night before with #1688/#1687) makes the post-merge run
      # open a NEW version PR instead — and the already-versioned packages
      # never reach npm (cli stuck at 1.10.0 while main was at 1.11.0). So when
      # the action did not publish, publish whatever main carries that npm
      # doesn't have. Safe because `changeset publish` skips versions already
      # on npm, and because the comparison is main's own package.json versions:
      # the action leaves the checkout on its `changeset-release/main` branch
      # (bumped, unmerged versions), so we first return to the pushed commit.
      # The pre-check makes the usual run (nothing unpublished) a no-op without
      # a build. Tags and GitHub releases for what this publishes are created by
      # the reconcile step below (changeset publish only tags locally here);
      # its `recovered=true` and this step's success both open the post-
      # release steps.
      - name: Check for versions on main missing from npm
        id: unpublished
        if: ${{ !cancelled() && steps.changesets.outcome == 'success' && steps.changesets.outputs.published != 'true' }}
        run: |
          git checkout --force --detach "$GITHUB_SHA"
          node scripts/list-unpublished-packages.mjs

      - name: Publish versions the changesets action skipped
        id: publish-missed
        if: ${{ !cancelled() && steps.unpublished.outputs.pending == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/publish-with-retry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets/action pushes one git tag per published package,
      # sequentially, in a single burst — pushing ~100 tags back-to-back in
      # a few seconds has hit GitHub's ref-write path hard enough to reject
      # a chunk of them with "fatal error in commit_refs" (2026-07-16, the
      # #289 release: 15 of 98 tag pushes rejected — transient, GitHub-side,
      # not a bug in what we're pushing). changesets/action then exits
      # non-zero, which fails this step and skips everything below even
      # though every package had already published to npm fine. This step
      # reconciles: any package live on npm without a matching tag gets one,
      # retried with backoff (see scripts/reconcile-release-tags.mjs for the
      # full account). `if: always()` so it runs and recovers regardless of
      # whether the step above fully succeeded.
      - name: Reconcile tags with npm-published versions
        id: reconcile
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reconcile-release-tags.mjs

      # packages/vscode also gets a dev-build VSIX on every push that touches
      # it (.github/workflows/vscode-release.yml) — that one rides the
      # Marketplace's *pre-release* channel on a synthesized high-patch
      # version, and is mirrored to a GitHub prerelease tagged by commit sha
      # (vscode-dev-<sha>), for grabbing a bleeding-edge build. This step is
      # the *stable* counterpart: the
      # same version-bump-driven release every other package gets, gated on
      # the same "actually published" condition as the steps below it (true
      # only for a deliberate release, not every PR merge), tagged by the
      # real changesets-bumped version with no sha suffix. It no-ops if
      # packages/vscode hasn't changed since the last such release, so a
      # release batch that doesn't touch the extension doesn't produce a
      # duplicate, identical vsix.
      - name: Package + publish VS Code extension
        if: always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          last_tag=$(git tag --list 'vscode-v*' --sort=-creatordate | head -1 || true)
          if [ -n "$last_tag" ] && git diff --quiet "$last_tag" HEAD -- packages/vscode; then
            echo "No packages/vscode changes since $last_tag — skipping VSIX build."
            exit 0
          fi
          pnpm --filter agentproto-vscode run package
          version=$(node -p "require('./packages/vscode/package.json').version")
          tag="vscode-v${version}"
          vsix=$(ls packages/vscode/output/*.vsix)

          # The stable Marketplace channel. No --pre-release: this VSIX is
          # packaged without it, and stable owns the low patch numbers that
          # changesets counts up from, while the pre-release rail offsets
          # itself six digits higher so the two lanes can't collide (see the
          # version note atop vscode-release.yml). --skip-duplicate rather
          # than a hard failure: this step can legitimately re-run against a
          # version that's already live (the force_post_release_steps
          # backfill, a reconcile-driven re-run), and a Marketplace 409 must
          # not turn an otherwise-successful release red.
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::VSCE_PAT is not set — skipping the Marketplace publish; the VSIX still ships to the GitHub release below. Add an Azure DevOps PAT (scope: Marketplace → Manage) as the VSCE_PAT repo secret to enable this."
          else
            pnpm dlx @vscode/vsce publish --skip-duplicate --packagePath "$vsix"
          fi

          # Idempotent, mirroring the skill-pack step below: the extension is
          # private and changesets doesn't bump it, so a run can legitimately
          # reach a `vscode-v${version}` whose GitHub release already exists
          # (packages/vscode changed since the last tag but the version didn't,
          # a force_post_release_steps backfill, a reconcile re-run). A plain
          # `gh release create` hard-fails on that duplicate tag and turns an
          # otherwise-successful release red — exactly what `--skip-duplicate`
          # already prevents on the Marketplace side. Refresh the asset instead.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — refreshing its VSIX asset instead of recreating."
            gh release upload "$tag" "$vsix" --clobber
          else
            gh release create "$tag" "$vsix" \
              --title "agentproto VS Code extension v${version}" \
              --notes "Official release, built from $(git rev-parse HEAD). Published to the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=Agentproto.agentproto-vscode) — or install this VSIX directly with VS Code's **Extensions: Install from VSIX...** command, or \`code --install-extension\`." \
              --latest=false
          fi

      # Skill packs (packages/skill-pack-*) ship two ways from ONE build (see
      # each package's scripts/build.mjs, already run by "Build all packages"
      # above, before changesets bumped-and-published from this same
      # checkout): the npm package itself (skills/ + .claude-plugin/, resolved
      # by `agentproto install skill/<slug>` or `--pack <name>`), and a
      # versioned .zip bundle at dist/<manifest-name>-v<version>.zip — the
      # Claude Code / Anthropic-installable artifact, unzip-and-go, no
      # agentproto required. npm publish is changesets' job like any other
      # package; this step only attaches that already-built zip to the
      # per-package GitHub release changesets/action creates (tag
      # `<npm-name>@<version>`, reconciled by reconcile-release-tags.mjs same
      # as any package). Guarded per-package on the release actually
      # existing, since a given run may not have published either — or only
      # one — of them.
      - name: Attach skill-pack bundles to their GitHub releases
        if: always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/skill-pack-*; do
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            manifestName=$(node -p "require('./${dir}/manifest.json').name")
            tag="${name}@${version}"
            zip="${dir}/dist/${manifestName}-v${version}.zip"

            if ! gh release view "$tag" >/dev/null 2>&1; then
              echo "No GitHub release for $tag this run — skipping (package unchanged)."
              continue
            fi
            if [ ! -f "$zip" ]; then
              echo "::warning::$tag has a release but no built zip at $zip — was the build step skipped?"
              continue
            fi
            gh release upload "$tag" "$zip" --clobber
            echo "Attached $zip to release $tag"
          done

      # Only runs when packages were actually published — by changesets/action
      # or by the missed-versions step above (not when it just opened the
      # "Version Packages" PR). The agent reads every
      # per-package CHANGELOG, greps the codebase for context, and posts a
      # consolidated human-readable release to GitHub Releases.
      #
      # BACKEND SELECTOR. Automated runs use the free-model preset shared with
      # PR review; workflow_dispatch can instead select Claude Code Cloud:
      #   1. MiMo v2.6 Flash (primary OpenCode account)
      #   2. Step 5 Preview (ws02 when configured, otherwise the primary key)
      # Each lane is followed by `release-notes.mjs --check`, which asks GitHub
      # whether a consolidated release already carries THIS batch's marker; the
      # next lane only runs when it doesn't. Every lane is continue-on-error;
      # the final gate below is the one honest red.
      - name: Resolve release-notes agent chain
        id: release-agent
        if: always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        env:
          AGENT_BACKEND: ${{ inputs.agent_backend != 'auto' && inputs.agent_backend || '' }}
        run: node scripts/resolve-agent-action.mjs release-notes --github-output

      - name: Resolve docs-check agent chain
        id: docs-agent
        if: always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        env:
          AGENT_BACKEND: ${{ inputs.agent_backend != 'auto' && inputs.agent_backend || '' }}
        run: node scripts/resolve-agent-action.mjs docs-check --github-output

      - name: Install OpenCode runtime for free release agents
        if: always() && (steps.release-agent.outputs.free_primary_model != '' || steps.docs-agent.outputs.free_primary_model != '') && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        run: npm install --global opencode-ai@1.19.0

      - name: Install Claude Code Cloud runtime
        if: always() && (steps.release-agent.outputs.has_cloud == 'true' || steps.docs-agent.outputs.has_cloud == 'true') && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        run: npm install --global @anthropic-ai/claude-code@2.1.300

      - name: Trust this disposable checkout for Claude Cloud
        if: always() && (steps.release-agent.outputs.has_cloud == 'true' || steps.docs-agent.outputs.has_cloud == 'true') && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        run: |
          node -e '
            const fs=require("fs"), os=require("os"), path=require("path");
            const p=path.join(os.homedir(), ".claude.json");
            let c={}; try { c=JSON.parse(fs.readFileSync(p,"utf8")) } catch {}
            c.projects ||= {};
            c.projects[fs.realpathSync(process.env.GITHUB_WORKSPACE)] = {hasTrustDialogAccepted:true,hasCompletedProjectOnboarding:true};
            fs.writeFileSync(p, JSON.stringify(c));
          '

      - name: Generate and publish release notes (Claude Cloud primary)
        id: notes-cloud-primary
        if: always() && steps.release-agent.outputs.backend == 'claude-cloud' && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        timeout-minutes: 45
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLOUD_OAUTH_TOKEN: ${{ secrets.CLAUDE_CLOUD_OAUTH_TOKEN }}
          CLAUDE_CLOUD_ORG_UUID: ${{ secrets.CLAUDE_CLOUD_ORG_UUID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs --print-cloud-prompt > "$RUNNER_TEMP/release-notes-cloud.prompt"
          node scripts/claude-cloud-ci.mjs \
            --prompt-file "$RUNNER_TEMP/release-notes-cloud.prompt" \
            --output "$RUNNER_TEMP/release-notes-cloud.md" \
            --label ci-release-notes
          node scripts/release-notes.mjs --body-file "$RUNNER_TEMP/release-notes-cloud.md"

      - name: Release notes posted? (after Claude Cloud primary)
        id: notes-check-cloud-primary
        if: always() && steps.release-agent.outputs.backend == 'claude-cloud' && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate agentic release notes (OpenCode free)
        id: notes-1
        if: always() && steps.release-agent.outputs.free_primary_model != '' && steps.notes-check-cloud-primary.outputs.posted != 'true' && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/release-notes.mjs
        env:
          AGENT_LANE: opencode-free
          AGENT_MODEL: ${{ steps.release-agent.outputs.free_primary_model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes posted? (after OpenCode free)
        id: notes-check-1
        if: always() && steps.release-agent.outputs.free_primary_model != '' && steps.notes-check-cloud-primary.outputs.posted != 'true' && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate agentic release notes (OpenCode free fallback)
        id: notes-2
        if:
          always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.release-agent.outputs.free_fallback_model != '' &&
          steps.notes-check-1.outputs.posted != 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/release-notes.mjs
        env:
          AGENT_LANE: opencode-free
          AGENT_MODEL: ${{ steps.release-agent.outputs.free_fallback_model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_WS03 || secrets.OPENCODE_API_KEY_WS02 || secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes posted? (after OpenCode free fallback)
        id: notes-check-2
        if:
          always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.release-agent.outputs.free_fallback_model != '' &&
          steps.notes-check-1.outputs.posted != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and publish release notes (Claude Cloud fallback)
        id: notes-cloud-fallback
        if: always() && steps.release-agent.outputs.backend != 'claude-cloud' && steps.release-agent.outputs.has_cloud == 'true' && steps.notes-check-1.outputs.posted != 'true' && steps.notes-check-2.outputs.posted != 'true' && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        timeout-minutes: 45
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLOUD_OAUTH_TOKEN: ${{ secrets.CLAUDE_CLOUD_OAUTH_TOKEN }}
          CLAUDE_CLOUD_ORG_UUID: ${{ secrets.CLAUDE_CLOUD_ORG_UUID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/release-notes.mjs --print-cloud-prompt > "$RUNNER_TEMP/release-notes-cloud.prompt"
          node scripts/claude-cloud-ci.mjs \
            --prompt-file "$RUNNER_TEMP/release-notes-cloud.prompt" \
            --output "$RUNNER_TEMP/release-notes-cloud.md" \
            --label ci-release-notes-fallback
          node scripts/release-notes.mjs --body-file "$RUNNER_TEMP/release-notes-cloud.md"

      - name: Release notes posted? (final gate)
        if: always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then exit 0; fi
          echo "::error::The selected LLM backend produced no consolidated release notes for this batch. Backfill with workflow_dispatch and force_post_release_steps=true."
          exit 1

      # Checks the hand-maintained docs (docs/**, README.md, per-package
      # README.md) for drift against what this release actually shipped, and
      # edits any stale ones directly (scripts/docs-check.mjs, OpenCode or
      # Claude Code Cloud).
      # "Machine proposes, human merges": like catalog-sync.yml, edits
      # land as a draft PR, never a direct commit to main.
      #
      # Uses the ordered per-action chain (cloud/free or free/cloud). Each step
      # reports `status=ok|error|no-result|no-lane`; the
      # next lane only runs when the previous one wasn't ok. Every lane is
      # continue-on-error and the script itself soft-fails — this is a
      # best-effort bonus on top of an already-published release.
      - name: Check docs for release drift (Claude Cloud primary)
        id: docs-cloud-primary
        if: always() && steps.docs-agent.outputs.backend == 'claude-cloud' && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        timeout-minutes: 45
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLOUD_OAUTH_TOKEN: ${{ secrets.CLAUDE_CLOUD_OAUTH_TOKEN }}
          CLAUDE_CLOUD_ORG_UUID: ${{ secrets.CLAUDE_CLOUD_ORG_UUID }}
        run: |
          node scripts/docs-check.mjs --print-cloud-prompt > "$RUNNER_TEMP/docs-check-cloud.prompt"
          node scripts/claude-cloud-ci.mjs \
            --prompt-file "$RUNNER_TEMP/docs-check-cloud.prompt" \
            --output "$RUNNER_TEMP/docs-check-cloud.patch" \
            --label ci-docs-check
          node scripts/apply-cloud-docs-patch.mjs "$RUNNER_TEMP/docs-check-cloud.patch"
          echo "status=ok" >> "$GITHUB_OUTPUT"

      - name: Check docs for release drift (OpenCode free)
        id: docs-1
        if: always() && steps.docs-agent.outputs.free_primary_model != '' && steps.docs-cloud-primary.outputs.status != 'ok' && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/docs-check.mjs
        env:
          AGENT_LANE: opencode-free
          AGENT_MODEL: ${{ steps.docs-agent.outputs.free_primary_model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      - name: Check docs for release drift (OpenCode free fallback)
        id: docs-2
        if:
          always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.docs-agent.outputs.free_fallback_model != '' &&
          steps.docs-1.outputs.status != 'ok'
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/docs-check.mjs
        env:
          AGENT_LANE: opencode-free
          AGENT_MODEL: ${{ steps.docs-agent.outputs.free_fallback_model }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY_WS03 || secrets.OPENCODE_API_KEY_WS02 || secrets.OPENCODE_API_KEY }}

      - name: Check docs for release drift (Claude Cloud fallback)
        id: docs-cloud-fallback
        if: always() && steps.docs-agent.outputs.backend != 'claude-cloud' && steps.docs-agent.outputs.has_cloud == 'true' && steps.docs-1.outputs.status != 'ok' && steps.docs-2.outputs.status != 'ok' && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        timeout-minutes: 45
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CLOUD_OAUTH_TOKEN: ${{ secrets.CLAUDE_CLOUD_OAUTH_TOKEN }}
          CLAUDE_CLOUD_ORG_UUID: ${{ secrets.CLAUDE_CLOUD_ORG_UUID }}
        run: |
          node scripts/docs-check.mjs --print-cloud-prompt > "$RUNNER_TEMP/docs-check-cloud.prompt"
          node scripts/claude-cloud-ci.mjs \
            --prompt-file "$RUNNER_TEMP/docs-check-cloud.prompt" \
            --output "$RUNNER_TEMP/docs-check-cloud.patch" \
            --label ci-docs-check-fallback
          node scripts/apply-cloud-docs-patch.mjs "$RUNNER_TEMP/docs-check-cloud.patch"
          echo "status=ok" >> "$GITHUB_OUTPUT"
      - name: Detect docs drift
        id: docs-drift
        if: always() && (steps.changesets.outputs.published == 'true' || steps.publish-missed.outcome == 'success' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No doc drift found — nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Doc drift detected" >> "$GITHUB_STEP_SUMMARY"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open docs PR
        if: always() && steps.docs-drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs-sync/auto
          base: main
          commit-message: 'docs: sync stale docs with latest release'
          title: 'docs: sync stale docs with latest release'
          draft: true
          body: |
            Automated doc-drift check after the latest release, via
            `scripts/docs-check.mjs` using the selected release-agent backend
            (OpenCode MiMo → Step 5, or Claude Code Cloud).

            The agent compared each published package's CHANGELOG entry
            against `docs/**`, the root `README.md`, and per-package
            `README.md` files, and edited whatever it found factually stale.

            Opened as a **draft** — review before merging, same as any
            LLM-authored doc change.
          labels: |
            docs-sync
            automated
          delete-branch: true
