name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:  # manual recovery trigger if push event is ever skipped
    inputs:
      force_post_release_steps:
        description: >-
          Run the VS Code publish / release notes / docs-check steps against
          the current HEAD even though changesets has nothing new to
          publish. For backfilling those steps after a run where
          changesets/action published fine but died on something after
          (e.g. the tag-push flake reconcile-release-tags.mjs recovers from
          automatically) — a manual escape hatch for the case that recovery
          couldn't cover, not something to reach for routinely.
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release in progress

permissions:
  contents: write        # create tags + GitHub releases
  pull-requests: write   # open "Version Packages" PR
  id-token: write        # npm provenance attestation

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout (full history for changesets)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # changesets/action does one of two things depending on state:
      #
      # A) Pending changesets exist → opens (or updates) a "Version Packages"
      #    PR that bumps versions + regenerates CHANGELOGs.
      #
      # B) No pending changesets (i.e. the "Version Packages" PR was just
      #    merged) → publishes every package whose version isn't yet on npm
      #    and creates a GitHub release per package.
      - name: Version or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release:ci
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN must be a granular access token with "Bypass 2FA"
          # scoped to the @agentproto org. Set it in the repo's Secrets.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # changesets/action drops EVERY per-package changelog from the "Version
      # Packages" PR body once the rendered body crosses GitHub's 65 536-char
      # cap — #1072 (241 files, 60 packages) shipped with bare headings and
      # "omitted … exceeds the size limit", nothing to review. Re-post the
      # full changelog as marker-tagged comments (chunked under the comment
      # cap, updated in place on every run, removed when the body wasn't
      # truncated). continue-on-error: reviewability bonus on top of an
      # already-successful version step, never a red release job.
      - name: Post full changelog on the Version Packages PR
        if: always() && steps.changesets.outputs.pullRequestNumber != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
          REPO: ${{ github.repository }}
        run: node scripts/version-pr-changelog.mjs

      # changesets/action pushes one git tag per published package,
      # sequentially, in a single burst — pushing ~100 tags back-to-back in
      # a few seconds has hit GitHub's ref-write path hard enough to reject
      # a chunk of them with "fatal error in commit_refs" (2026-07-16, the
      # #289 release: 15 of 98 tag pushes rejected — transient, GitHub-side,
      # not a bug in what we're pushing). changesets/action then exits
      # non-zero, which fails this step and skips everything below even
      # though every package had already published to npm fine. This step
      # reconciles: any package live on npm without a matching tag gets one,
      # retried with backoff (see scripts/reconcile-release-tags.mjs for the
      # full account). `if: always()` so it runs and recovers regardless of
      # whether the step above fully succeeded.
      - name: Reconcile tags with npm-published versions
        id: reconcile
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/reconcile-release-tags.mjs

      # packages/vscode also gets a dev-build VSIX on every push that touches
      # it (.github/workflows/vscode-release.yml) — that one rides the
      # Marketplace's *pre-release* channel on a synthesized high-patch
      # version, and is mirrored to a GitHub prerelease tagged by commit sha
      # (vscode-dev-<sha>), for grabbing a bleeding-edge build. This step is
      # the *stable* counterpart: the
      # same version-bump-driven release every other package gets, gated on
      # the same "actually published" condition as the steps below it (true
      # only for a deliberate release, not every PR merge), tagged by the
      # real changesets-bumped version with no sha suffix. It no-ops if
      # packages/vscode hasn't changed since the last such release, so a
      # release batch that doesn't touch the extension doesn't produce a
      # duplicate, identical vsix.
      - name: Package + publish VS Code extension
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          set -euo pipefail
          last_tag=$(git tag --list 'vscode-v*' --sort=-creatordate | head -1 || true)
          if [ -n "$last_tag" ] && git diff --quiet "$last_tag" HEAD -- packages/vscode; then
            echo "No packages/vscode changes since $last_tag — skipping VSIX build."
            exit 0
          fi
          pnpm --filter agentproto-vscode run package
          version=$(node -p "require('./packages/vscode/package.json').version")
          tag="vscode-v${version}"
          vsix=$(ls packages/vscode/output/*.vsix)

          # The stable Marketplace channel. No --pre-release: this VSIX is
          # packaged without it, and stable owns the low patch numbers that
          # changesets counts up from, while the pre-release rail offsets
          # itself six digits higher so the two lanes can't collide (see the
          # version note atop vscode-release.yml). --skip-duplicate rather
          # than a hard failure: this step can legitimately re-run against a
          # version that's already live (the force_post_release_steps
          # backfill, a reconcile-driven re-run), and a Marketplace 409 must
          # not turn an otherwise-successful release red.
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "::warning::VSCE_PAT is not set — skipping the Marketplace publish; the VSIX still ships to the GitHub release below. Add an Azure DevOps PAT (scope: Marketplace → Manage) as the VSCE_PAT repo secret to enable this."
          else
            pnpm dlx @vscode/vsce publish --skip-duplicate --packagePath "$vsix"
          fi

          # Idempotent, mirroring the skill-pack step below: the extension is
          # private and changesets doesn't bump it, so a run can legitimately
          # reach a `vscode-v${version}` whose GitHub release already exists
          # (packages/vscode changed since the last tag but the version didn't,
          # a force_post_release_steps backfill, a reconcile re-run). A plain
          # `gh release create` hard-fails on that duplicate tag and turns an
          # otherwise-successful release red — exactly what `--skip-duplicate`
          # already prevents on the Marketplace side. Refresh the asset instead.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — refreshing its VSIX asset instead of recreating."
            gh release upload "$tag" "$vsix" --clobber
          else
            gh release create "$tag" "$vsix" \
              --title "agentproto VS Code extension v${version}" \
              --notes "Official release, built from $(git rev-parse HEAD). Published to the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=Agentproto.agentproto-vscode) — or install this VSIX directly with VS Code's **Extensions: Install from VSIX...** command, or \`code --install-extension\`." \
              --latest=false
          fi

      # Skill packs (packages/skill-pack-*) ship two ways from ONE build (see
      # each package's scripts/build.mjs, already run by "Build all packages"
      # above, before changesets bumped-and-published from this same
      # checkout): the npm package itself (skills/ + .claude-plugin/, resolved
      # by `agentproto install skill/<slug>` or `--pack <name>`), and a
      # versioned .zip bundle at dist/<manifest-name>-v<version>.zip — the
      # Claude Code / Anthropic-installable artifact, unzip-and-go, no
      # agentproto required. npm publish is changesets' job like any other
      # package; this step only attaches that already-built zip to the
      # per-package GitHub release changesets/action creates (tag
      # `<npm-name>@<version>`, reconciled by reconcile-release-tags.mjs same
      # as any package). Guarded per-package on the release actually
      # existing, since a given run may not have published either — or only
      # one — of them.
      - name: Attach skill-pack bundles to their GitHub releases
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/skill-pack-*; do
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            manifestName=$(node -p "require('./${dir}/manifest.json').name")
            tag="${name}@${version}"
            zip="${dir}/dist/${manifestName}-v${version}.zip"

            if ! gh release view "$tag" >/dev/null 2>&1; then
              echo "No GitHub release for $tag this run — skipping (package unchanged)."
              continue
            fi
            if [ ! -f "$zip" ]; then
              echo "::warning::$tag has a release but no built zip at $zip — was the build step skipped?"
              continue
            fi
            gh release upload "$tag" "$zip" --clobber
            echo "Attached $zip to release $tag"
          done

      # Only runs when changesets/action actually published packages (not when
      # it just opened the "Version Packages" PR). The agent reads every
      # per-package CHANGELOG, greps the codebase for context, and posts a
      # consolidated human-readable release to GitHub Releases.
      #
      # BILLING LADDER. 2026-09-01: two Anthropic orgs and a Moonshot account
      # all ran dry within the hour and every agentic post-release step died on
      # its first API call — the batch shipped to npm with no notes at all. The
      # notes step now walks lanes (scripts/lib/agent-lane.mjs), the same shape
      # as the CI review job's subscription → fallback → API-key ladder:
      #   1. subscription          CLAUDE_CODE_OAUTH_TOKEN (claude.ai plan, no per-token bill)
      #   2. subscription-fallback CLAUDE_CODE_OAUTH_TOKEN_FALLBACK
      #   3. openrouter            OPENROUTER_API_KEY via OpenRouter's Anthropic-compatible endpoint
      #   4. api-key               ANTHROPIC_API_KEY, last resort (the only lane that bills the org)
      # Each lane is followed by `release-notes.mjs --check`, which asks GitHub
      # whether a consolidated release already carries THIS batch's marker; the
      # next lane only runs when it doesn't. Every lane is continue-on-error;
      # the final gate below is the one honest red.
      - name: Generate agentic release notes (subscription)
        id: notes-1
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        run: node scripts/release-notes.mjs
        env:
          AGENT_LANE: subscription
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes posted? (after subscription)
        id: notes-check-1
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate agentic release notes (fallback subscription)
        id: notes-2
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.notes-check-1.outputs.posted != 'true'
        continue-on-error: true
        run: node scripts/release-notes.mjs
        env:
          AGENT_LANE: subscription-fallback
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes posted? (after fallback subscription)
        id: notes-check-2
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.notes-check-1.outputs.posted != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate agentic release notes (openrouter)
        id: notes-3
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.notes-check-2.outputs.posted != 'true'
        continue-on-error: true
        run: node scripts/release-notes.mjs
        env:
          AGENT_LANE: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes posted? (after openrouter)
        id: notes-check-3
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.notes-check-2.outputs.posted != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate agentic release notes (api-key)
        id: notes-4
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.notes-check-3.outputs.posted != 'true'
        continue-on-error: true
        run: node scripts/release-notes.mjs
        env:
          AGENT_LANE: api-key
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release notes posted? (after api-key)
        id: notes-check-4
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.notes-check-3.outputs.posted != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes posted? (final gate)
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if node scripts/release-notes.mjs --check; then exit 0; fi
          echo "::error::No lane produced consolidated release notes for this batch — see the four notes steps above. Backfill with: gh workflow run Release --ref main -f force_post_release_steps=true"
          exit 1

      # Checks the hand-maintained docs (docs/**, README.md, per-package
      # README.md) for drift against what this release actually shipped, and
      # edits any stale ones directly (scripts/docs-check.mjs, Claude Agent
      # SDK). "Machine proposes, human merges": like catalog-sync.yml, edits
      # land as a draft PR, never a direct commit to main.
      #
      # Same billing ladder as the notes above, Moonshot last (it was the only
      # lane before, and its account is the one that went "suspended due to
      # insufficient balance"). Each step reports `status=ok|error|no-result|
      # no-lane`; the next lane only runs when the previous one wasn't ok.
      # Every lane is continue-on-error and the script itself soft-fails —
      # this is a best-effort bonus on top of an already-published release.
      - name: Check docs for release drift (subscription)
        id: docs-1
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        continue-on-error: true
        run: node scripts/docs-check.mjs
        env:
          AGENT_LANE: subscription
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Check docs for release drift (fallback subscription)
        id: docs-2
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.docs-1.outputs.status != 'ok'
        continue-on-error: true
        run: node scripts/docs-check.mjs
        env:
          AGENT_LANE: subscription-fallback
          CLAUDE_CODE_OAUTH_TOKEN_FALLBACK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
      - name: Check docs for release drift (openrouter)
        id: docs-3
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.docs-1.outputs.status != 'ok' &&
          steps.docs-2.outputs.status != 'ok'
        continue-on-error: true
        run: node scripts/docs-check.mjs
        env:
          AGENT_LANE: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Check docs for release drift (moonshot)
        id: docs-4
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true) &&
          steps.docs-1.outputs.status != 'ok' &&
          steps.docs-2.outputs.status != 'ok' &&
          steps.docs-3.outputs.status != 'ok'
        continue-on-error: true
        run: node scripts/docs-check.mjs
        env:
          AGENT_LANE: moonshot
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      - name: Detect docs drift
        id: docs-drift
        if: always() && (steps.changesets.outputs.published == 'true' || steps.reconcile.outputs.recovered == 'true' || inputs.force_post_release_steps == true)
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No doc drift found — nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Doc drift detected" >> "$GITHUB_STEP_SUMMARY"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open docs PR
        if: always() && steps.docs-drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs-sync/auto
          base: main
          commit-message: "docs: sync stale docs with latest release"
          title: "docs: sync stale docs with latest release"
          draft: true
          body: |
            Automated doc-drift check after the latest release, via
            `scripts/docs-check.mjs` (Claude Agent SDK on Moonshot's
            `kimi-k2.7-code`).

            The agent compared each published package's CHANGELOG entry
            against `docs/**`, the root `README.md`, and per-package
            `README.md` files, and edited whatever it found factually stale.

            Opened as a **draft** — review before merging, same as any
            LLM-authored doc change.
          labels: |
            docs-sync
            automated
          delete-branch: true
