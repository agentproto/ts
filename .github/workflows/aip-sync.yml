name: AIP Sync

# Re-vendors specs/resources from agentproto/agentproto main and moves the
# pin in specs/canonical.lock.json, then opens a PR for human review. The PR
# is opened whenever the pin moves, even with no specs/resources drift: a
# prose-only AIP (no JSON Schema) still has to reach check-aip-refs.
# ts CI checks canonical out AT the pinned commit (see ci.yml), so canonical
# merges never break ts on their own: this PR is how ts catches up.
#
# Triggers:
#   - repository_dispatch specs-changed: sent by agentproto/agentproto's
#     notify workflow on every push to specs/** (needs TS_DISPATCH_TOKEN there)
#   - schedule: weekly safety net if a dispatch was missed
#   - workflow_dispatch: on demand

on:
  repository_dispatch:
    types: [specs-changed]
  schedule:
    - cron: "0 6 * * 2" # Tuesdays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Re-vendor canonical specs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # No `pnpm install` runs in this job, so there is no store to cache;
          # setup-node's automatic pnpm cache failed its post step on the
          # missing path.
          package-manager-cache: false

      - name: Checkout canonical specs (main)
        uses: actions/checkout@v5
        with:
          repository: agentproto/agentproto
          ref: main
          path: .canonical-specs
          fetch-depth: 1

      - name: Sync specs/resources and move the pin
        id: sync
        run: |
          SHA=$(git -C .canonical-specs rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          node scripts/sync-specs.mjs --source .canonical-specs/specs/resources --source-sha "$SHA"

      # The pin moving is the signal: sync-specs rewrites the lock to the
      # canonical HEAD, so a prose-only canonical change (no specs/resources
      # drift) still shows up as a lock diff and gets a pin-bump PR.
      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- specs/resources specs/canonical.lock.json && [ -z "$(git ls-files --others --exclude-standard -- specs/resources)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Pin already at ${{ steps.sync.outputs.sha }} and no specs/resources drift — nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            if git diff --quiet -- specs/resources && [ -z "$(git ls-files --others --exclude-standard -- specs/resources)" ]; then
              echo "resources=false" >> "$GITHUB_OUTPUT"
            else
              echo "resources=true" >> "$GITHUB_OUTPUT"
            fi
            echo "### Spec drift from agentproto/agentproto@${{ steps.sync.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
            git status --short -- specs >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check the synced tree
        if: steps.drift.outputs.changed == 'true'
        run: node scripts/sync-specs.mjs --check --source .canonical-specs/specs/resources

      # Advisory here: the PR still opens so a human sees the result, and
      # ts CI runs the same gate against the pin once the PR is up.
      - name: Check AIP references against the new pin
        id: refs
        if: steps.drift.outputs.changed == 'true'
        continue-on-error: true
        run: node scripts/check-aip-refs.mjs --source .canonical-specs

      - name: Open sync PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          branch: aip-sync/auto
          base: main
          add-paths: |
            specs/resources/**
            specs/canonical.lock.json
          commit-message: "specs: sync vendored specs with agentproto/agentproto@${{ steps.sync.outputs.sha }}"
          title: "specs: sync vendored specs with canonical agentproto/agentproto"
          body: |
            Automated sync with agentproto/agentproto@${{ steps.sync.outputs.sha }}:
            the pin in `specs/canonical.lock.json` moved to that commit
            (specs/resources drift: ${{ steps.drift.outputs.resources }}; a
            `false` means a prose-only change, pin bump only).

            `check-aip-refs` against the new pin: ${{ steps.refs.outcome }}.

            - Review the schema diff like any spec change: a renumbering or a new
              required field may need matching code changes in the ts packages.
            - Spec text is authored in agentproto/agentproto, never here.
          labels: |
            aip-sync
            automated
          delete-branch: true
