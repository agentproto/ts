name: Agent command

# On-demand agent: slash-commands (/review, /fix, /pr, /explain, /help) and
# @mention free-text on PRs and issues. The auto-review/fix on push lives in
# ci.yml; this is the human-in-the-loop trigger.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Gate at the job level: only write-access authors, only comments that look like
# a command. The dispatcher (scripts/agent-command.mjs) is the real parser and
# exits cleanly if it finds no command.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  command:
    name: Run agent command
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (startsWith(github.event.comment.body, '/') ||
       contains(github.event.comment.body, '@agentproto-bot'))
    steps:
      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Resolve target (PR vs issue) + comment reactions path
        id: ctx
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          CID="${{ github.event.comment.id }}"
          if [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "head_ref=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
            echo "reactions=repos/$REPO/pulls/comments/$CID/reactions" >> "$GITHUB_OUTPUT"
          else
            NUM="${{ github.event.issue.number }}"
            echo "reactions=repos/$REPO/issues/comments/$CID/reactions" >> "$GITHUB_OUTPUT"
            if [ -n "${{ github.event.issue.pull_request.url }}" ]; then
              HEAD=$(gh pr view "$NUM" --repo "$REPO" --json headRefName -q .headRefName)
              echo "is_pr=true" >> "$GITHUB_OUTPUT"
              echo "number=$NUM" >> "$GITHUB_OUTPUT"
              echo "head_ref=$HEAD" >> "$GITHUB_OUTPUT"
            else
              echo "is_pr=false" >> "$GITHUB_OUTPUT"
              echo "number=$NUM" >> "$GITHUB_OUTPUT"
              echo "head_ref=main" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: React 👀 (acknowledge)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        run: gh api "${{ steps.ctx.outputs.reactions }}" -f content=eyes || true

      - name: Checkout target branch (with write token)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.ctx.outputs.head_ref }}
          token: ${{ steps.bot.outputs.token || secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Dependencies are needed for run_command (build/test/check-types) and for
      # gh_open_pr changesets. Skip-able for /help and /explain but cheap enough
      # with the pnpm cache to always install.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Sandboxed agentflow lane (review / pr / implement / fix) ──────────
      # The same "sandboxed agentproto agent" block ci.yml's auto-review uses
      # (.github/actions/agentproto-run + .github/agentproto-workflows/*),
      # routed by verb: review → pr-review workflow; pr/implement/fix →
      # agent-verb workflow. The legacy runner-side agent loop below stays the
      # FALLBACK (sandbox unconfigured, non-sandbox verbs, or lane failure).
      - name: Parse command (routing)
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ steps.ctx.outputs.is_pr == 'true' && steps.ctx.outputs.number || '' }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.is_pr == 'false' && steps.ctx.outputs.number || '' }}
        run: node scripts/agent-command.mjs --parse-only

      - name: Compose sandbox lane inputs
        id: compose
        if: steps.parse.outputs.sandboxable == 'true'
        env:
          VERB: ${{ steps.parse.outputs.verb }}
          REQUEST_B64: ${{ steps.parse.outputs.request_b64 }}
          FORCE_PR_DELIVERY: ${{ steps.parse.outputs.force_pr_delivery }}
          IS_PR: ${{ steps.ctx.outputs.is_pr }}
          NUMBER: ${{ steps.ctx.outputs.number }}
          HEAD_REF: ${{ steps.ctx.outputs.head_ref }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs")
            const cfg = JSON.parse(fs.readFileSync(".github/agentic-review.json", "utf8"))
            const verb = process.env.VERB
            // /fix --pr forces pr-delivery — override the per-verb config.
            if (verb === "fix" && process.env.FORCE_PR_DELIVERY === "true") {
              cfg.commands = cfg.commands || {}
              cfg.commands.fix = { ...(cfg.commands.fix || {}), fixDelivery: "pr" }
            }
            const isPr = process.env.IS_PR === "true"
            const num = Number(process.env.NUMBER || 0)
            const request = Buffer.from(process.env.REQUEST_B64 || "", "base64").toString("utf8")
            // NOTE: no githubToken here — the box receives GITHUB_TOKEN via
            // the sandbox env passthrough (daemon env → box env), so the
            // token never needs to ride a step output or the workflow input.
            const common = {
              repo: process.env.REPO,
              baseRef: "main",
              reviewConfig: cfg,
            }
            const input =
              verb === "review"
                ? { ...common, prNumber: num }
                : {
                    ...common,
                    verb,
                    prNumber: isPr ? num : 0,
                    issueNumber: isPr ? 0 : num,
                    requestText: request,
                    headRef: isPr ? process.env.HEAD_REF : "",
                  }
            const path =
              verb === "review"
                ? ".github/agentproto-workflows/pr-review/WORKFLOW.md"
                : ".github/agentproto-workflows/agent-verb/WORKFLOW.md"
            const out = [
              `workflow_path=${path}`,
              `workflow_input=${JSON.stringify(input)}`,
              `adapter=${String(cfg.reviewerAdapter || "claude-code")}`,
              `auth_mode=${String(cfg.reviewerAuthMode || "api-key")}`,
              `cli_source=${String(cfg.cliSource || "npm")}`,
              `cli_version=${String(cfg.cliVersion || "0.8.0")}`,
              "",
            ].join("\n")
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out)
          '

      - name: Build local agentproto CLI (workspace source)
        if: |
          steps.parse.outputs.sandboxable == 'true' &&
          steps.compose.outputs.cli_source == 'workspace'
        env:
          TURBO_API: https://turbo-cache-f5mennea6a-ew.a.run.app
          TURBO_TEAM: agentproto-ts
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: origin/main
        run: pnpm build --filter @agentproto/cli... --filter "@agentproto/adapter-${{ steps.compose.outputs.adapter }}..."

      - name: Run sandboxed agent verb
        id: sandbox-verb
        if: steps.parse.outputs.sandboxable == 'true'
        continue-on-error: true
        uses: ./.github/actions/agentproto-run
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          adapter: ${{ steps.compose.outputs.adapter }}
          auth-mode: ${{ steps.compose.outputs.auth_mode }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          e2b-api-key: ${{ secrets.E2B_API_KEY }}
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse-base-url: ${{ secrets.LANGFUSE_BASE_URL }}
          langfuse-project: ${{ secrets.LANGFUSE_PROJECT }}
          workflow-path: ${{ steps.compose.outputs.workflow_path }}
          cli-source: ${{ steps.compose.outputs.cli_source }}
          cli-version: ${{ steps.compose.outputs.cli_version }}
          workflow-input: ${{ steps.compose.outputs.workflow_input }}
          timeout-minutes: 20

      # ── Legacy runner-side agent loop — non-sandbox verbs (help / triage /
      # wiki / explain / freeform) and the FALLBACK when the sandbox lane is
      # unconfigured or failed.
      - name: Run agent command
        id: run
        if: |
          always() &&
          (steps.parse.outputs.sandboxable != 'true' ||
           steps.sandbox-verb.outcome == 'failure' ||
           steps.sandbox-verb.outputs.status == 'failed')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ steps.ctx.outputs.is_pr == 'true' && steps.ctx.outputs.number || '' }}
          ISSUE_NUMBER: ${{ steps.ctx.outputs.is_pr == 'false' && steps.ctx.outputs.number || '' }}
        run: node scripts/agent-command.mjs

      # Commit-mode /fix (and any verb that edited the tree without opening its
      # own PR) leaves changes on the checked-out head branch — commit + push.
      # gh_open_pr-based flows already switched to a bot/* branch (clean tree),
      # so this is a no-op for them.
      - name: Commit + push working-tree changes (commit-mode)
        if: always() && steps.ctx.outputs.is_pr == 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          # Attribute the commit to the App bot (mentionable) when available.
          bash scripts/configure-bot-git.sh
          CUR=$(git rev-parse --abbrev-ref HEAD)
          case "$CUR" in
            bot/*) echo "On bot branch $CUR — agent opened its own PR, nothing to push."; exit 0 ;;
          esac
          git add -A
          if git diff --cached --quiet; then
            echo "No working-tree changes to push."
          else
            git commit -m "chore: agent-command edit (from comment) [skip ci]"
            git push origin "HEAD:${{ steps.ctx.outputs.head_ref }}"
          fi

      - name: Stamp PR provenance footer
        if: >
          steps.parse.outputs.sandboxable == 'true' &&
          steps.sandbox-verb.outputs.status == 'done' &&
          (steps.parse.outputs.verb == 'pr' ||
           steps.parse.outputs.verb == 'implement' ||
           (steps.parse.outputs.verb == 'fix' && steps.parse.outputs.force_pr_delivery == 'true'))
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          AUTH_MODE: ${{ steps.compose.outputs.auth_mode }}
          PROVENANCE: ${{ steps.sandbox-verb.outputs.provenance }}
          # Artifact ledger (PR id/number at creation time) — the stamp keys off
          # this; empty ⇒ it falls back to placeholder discovery with a ::warning::.
          ARTIFACTS: ${{ steps.sandbox-verb.outputs.artifacts }}
        run: node scripts/stamp-pr-footer.mjs

      - name: React result (✅ / ❌)
        if: always()
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
        run: |
          # Success = the sandbox lane delivered (status=done), or the legacy
          # dispatcher ran and succeeded (including as the lane's fallback).
          CONTENT="-1"
          if [ "${{ steps.sandbox-verb.outputs.status }}" = "done" ]; then CONTENT="hooray"; fi
          if [ "${{ steps.run.outcome }}" = "success" ]; then CONTENT="hooray"; fi
          gh api "${{ steps.ctx.outputs.reactions }}" -f content="$CONTENT" || true
