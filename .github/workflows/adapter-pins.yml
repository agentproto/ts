name: Adapter pin freshness

# Weekly check of adapter package pins against the npm registry.
#
#   - Any drift is reported in one tracking issue (the fallback: it is always
#     kept, whatever happens to the PR below).
#   - Minor/patch drift of an explicit spawn pin also opens or updates ONE PR
#     (branch chore/adapter-pins-auto, fixed title) that rewrites the pins.
#     Major drift is only reported. The PR is not merged here: its
#     `Adapter pin smoke` check (adapter-pin-smoke.yml) spawns each bumped
#     adapter for real and is the proof the harness still works.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

concurrency:
  group: adapter-pins
  cancel-in-progress: false

permissions:
  contents: write # push the chore/adapter-pins-auto branch
  pull-requests: write # open the update PR
  issues: write

jobs:
  check:
    name: Check adapter pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Same App the catalog-sync PR uses. GitHub does NOT trigger workflows on
      # a PR opened with the default GITHUB_TOKEN, so without the App the pin PR
      # would get no CI and no smoke check. Falls back to GITHUB_TOKEN when no
      # App is configured (the PR is then checkless, but the job still works).
      - name: Mint bot token (GitHub App, optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Plain node, no pnpm on this runner: without this, setup-node v5 reads
          # packageManager (pnpm) and fails looking for the pnpm executable.
          package-manager-cache: false

      - name: Run checker tests
        run: node --test scripts/check-adapter-pins.test.mjs scripts/bump-adapter-pins.test.mjs scripts/adapter-pin-smoke.test.mjs

      - name: Check pins and build report
        id: pins
        run: |
          node scripts/check-adapter-pins.mjs --json > /tmp/adapter-pins.json
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("/tmp/adapter-pins.json", "utf8"));
          const rows = data.rows || [];
          const summary = data.summary || {};
          const drifted = summary.drifted || [];
          const unknown = summary.unknown || [];
          const fresh = summary.fresh === true;

          let body = `# Adapter pin freshness\n\n`;
          body += `Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\n\n`;
          body += `| adapter | package | pinned | latest | drift |\n`;
          body += `|---|---|---|---|---|\n`;
          for (const row of rows) {
            body += `| ${row.adapter} | \`${row.package}\` | ${row.pinned} | ${row.latest ?? "unavailable"} | ${row.drift} |\n`;
          }
          if (data.skipped && data.skipped.length > 0) {
            body += `\nAdapters without an npm pin: ${data.skipped.join(", ")}\n`;
          }
          if (unknown.length > 0) {
            body += `\nIndeterminate: the registry lookup failed for ${unknown.map((row) => `\`${row.package}\``).join(", ")}. A fresh result is not proven while these remain unknown, so an existing issue is left open.\n`;
            console.log(`::warning::Adapter pin lookup failed for ${unknown.map((row) => row.package).join(", ")}; not treating the run as fresh.`);
          }
          body += `\nMinor/patch drift of an explicit spawn pin is proposed in the PR titled \`chore(adapters): bump adapter pins\` (branch \`chore/adapter-pins-auto\`). Major drift and range-floor-only pins are never bumped automatically. This workflow does not merge.\n`;

          fs.writeFileSync("/tmp/adapter-pins.md", body);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `drifted=${drifted.length > 0}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `count=${drifted.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `unknown=${unknown.length}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `fresh=${fresh}\n`);
          NODE

      - name: Report to step summary
        run: cat /tmp/adapter-pins.md >> "$GITHUB_STEP_SUMMARY"

      # Rewrites explicit spawn pins for minor/patch drift in the working tree
      # (no network: it reads the JSON produced above).
      - name: Bump drifted pins
        id: bump
        # Fails soft: the issue report below must still run. The steps that
        # push a PR check `steps.bump.outcome == 'success'` themselves.
        continue-on-error: true
        run: |
          node scripts/bump-adapter-pins.mjs --report /tmp/adapter-pins.json \
            --plan-out /tmp/adapter-pins-plan.json --body-out /tmp/adapter-pins-pr.md
          COUNT=$(node -p 'JSON.parse(require("fs").readFileSync("/tmp/adapter-pins-plan.json","utf8")).bumped.length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          cat /tmp/adapter-pins-pr.md >> "$GITHUB_STEP_SUMMARY"

      # changeset-check fails a PR that touches a publishable package without a
      # changeset. Written deterministically from the working-tree diff, with a
      # unique name so it diffs as ADDED against main (see the script header).
      - name: Write changeset for the bumped adapters
        # An empty `count` (the bump step died) must not pass: `'' != '0'` is true.
        if: ${{ steps.bump.outcome == 'success' && steps.bump.outputs.count != '' && steps.bump.outputs.count != '0' }}
        run: |
          node scripts/write-catalog-changeset.mjs \
            --out ".changeset/adapter-pins-auto-$(date +%Y-%m-%d)-$(git rev-parse --short HEAD).md" \
            --message "Bump adapter npm pins to the latest minor/patch (smoke tested on the update PR)."

      # One PR on a fixed branch with a fixed title: create-pull-request force
      # updates the branch and edits the existing PR, so a weekly run never opens
      # a second one. Failure here must not hide the issue report below.
      - name: Open or update pin PR
        # Same guard: a half-applied bump is never pushed.
        if: ${{ steps.bump.outcome == 'success' && steps.bump.outputs.count != '' && steps.bump.outputs.count != '0' }}
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          branch: chore/adapter-pins-auto
          base: main
          commit-message: "chore(adapters): bump adapter pins"
          title: "chore(adapters): bump adapter pins"
          body-path: /tmp/adapter-pins-pr.md
          labels: |
            automated
          delete-branch: true

      # Dedup: look up the fixed title first and edit its body, so a weekly run
      # never opens a fresh issue per drifted pin.
      - name: Open or update tracking issue
        # `!cancelled()` so a failure in the bump/changeset steps above (which
        # carry an implicit success()) can never skip the fallback report.
        if: ${{ !cancelled() && steps.pins.outputs.drifted == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search '"chore: adapter pin freshness" in:title' \
            --json number --jq '.[0].number // ""' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            echo "Updating existing adapter pin issue #$NUM"
            gh issue edit "$NUM" --repo "${{ github.repository }}" \
              --title "chore: adapter pin freshness" --body-file /tmp/adapter-pins.md
          else
            echo "Creating adapter pin issue"
            gh issue create --repo "${{ github.repository }}" \
              --title "chore: adapter pin freshness" \
              --body-file /tmp/adapter-pins.md
          fi

      - name: Close tracking issue when the report is fresh
        if: ${{ !cancelled() && steps.pins.outputs.fresh == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search '"chore: adapter pin freshness" in:title' \
            --json number --jq '.[0].number // ""' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --repo "${{ github.repository }}" \
              --comment "All adapter pins are current as of $(date -u +%Y-%m-%d)."
          fi
