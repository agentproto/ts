name: Discussion responder

# Answer new discussions, and respond to /answer · @mention in discussion
# comments. Requires the GitHub App permission "Discussions: Read & write"
# (the API is GraphQL-only).

on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

permissions:
  contents: read
  discussions: write

jobs:
  respond:
    name: Respond to discussion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Comment events: only write-access authors. New-discussion events have no
    # comment author — always allowed (auto-answer).
    if: >
      github.event_name == 'discussion' ||
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    steps:
      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run discussion responder
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_NODE_ID: ${{ github.event.discussion.node_id }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: node scripts/discussion.mjs
