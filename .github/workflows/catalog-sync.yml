name: Catalog Sync

# Regenerates the model-catalog data (prices, model lists, voices) from the
# pinned provider sources via @agentproto/catalog-sync, then opens a PR with
# the diff for human review. Mirrors the changesets release flow: the machine
# proposes, a human merges. Data is never hand-committed — it is generated.
#
# Triggers:
#   - schedule: weekly, so provider price/model drift surfaces as a reviewable PR
#   - workflow_dispatch: on demand (e.g. after adding a generator)

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch provider sources (updates pinned snapshots). Off = regenerate from committed snapshots only."
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write # push the sync branch
  pull-requests: write # open the sync PR

jobs:
  sync:
    name: Regenerate catalog data
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Same App the rest of the repo's PR-writing jobs use (ci.yml,
      # issue-triage, discussion, agent-command). It is what makes the sync PR
      # run CI at all: GitHub deliberately does NOT trigger workflows on a PR
      # opened with the default GITHUB_TOKEN, so before this the sync PR landed
      # with zero checks and sat BLOCKED — 11k lines of generated pricing data
      # that nothing verified. Falls back to GITHUB_TOKEN when no App is
      # configured (the PR is then checkless again, but the job still works).
      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `...` suffix = the package AND its workspace dependencies. Required:
      # generators import subpaths like `@agentproto/model-catalog/providers`,
      # which resolve to that package's `dist/**/*.d.ts` — absent on a fresh
      # checkout, so a catalog-sync-only build fails its dts pass (TS2307).
      - name: Build catalog-sync
        run: pnpm --filter "@agentproto/catalog-sync..." build

      # `--refresh` re-fetches the pinned provider sources and rewrites the
      # committed snapshots; without it, generation is deterministic from the
      # snapshots already in the repo. Either way the *.generated.ts outputs
      # are rewritten; git surfaces any drift.
      - name: Regenerate catalog
        env:
          # Provider keys for authed sources (optional — public sources like
          # openrouter/models.dev need none). Absent secrets simply skip that
          # source's refresh; the committed snapshot is reused (no failure).
          # The env-var names match the `env:…` tokens in each generator's
          # CatalogSource.headers.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        # Invoke the built entrypoint directly rather than the `catalog-sync`
        # bin: that bin points at `./dist/bin.mjs`, which does not exist when
        # `pnpm install --frozen-lockfile` runs on a fresh checkout, so pnpm
        # never links it into node_modules/.bin and `exec catalog-sync` fails
        # with "Command not found". `exec` runs in the package directory.
        run: |
          pnpm --filter @agentproto/catalog-sync exec node dist/bin.mjs generate \
            ${{ (github.event_name == 'schedule' || inputs.refresh) && '--refresh' || '' }}

      # The OTHER half of the catalog. `catalog-sync generate` above only runs
      # the generators in packages/catalog-sync/src/generators/; the per-vendor
      # `scripts/catalog-sync/sync-*.mjs` scripts — which write the NATIVE
      # vendor lists (openai/anthropic/google/xai/mistral/moonshot/minimax
      # `*-pricing.generated.ts`) — were never run by anything. So they only
      # ever ran when a human remembered, and the native lists drifted:
      # openai-pricing.generated.ts sat at its 2026-08-31 sync, topping out at
      # gpt-5.6-*, while the repo's OWN committed OpenRouter snapshot already
      # carried the whole gpt-6-{luna,sol,astra} family. Running them here is
      # the fix — this job is the one place that already knows how to turn
      # generated-data drift into a reviewable PR.
      #
      # Gated on the same `--refresh` condition as the step above: these
      # scripts have no snapshot mode (they always fetch live), so under an
      # explicit `refresh: false` dispatch — "regenerate from committed
      # snapshots only" — they must not run at all.
      #
      # run-all.mjs owns the exit-code contract: exit 2 from a script whose
      # optional API key is absent is a SKIP, not a failure (same tolerance the
      # generators have for a missing secret), while a genuine vendor-API break
      # still fails the job. MISTRAL_API_KEY is listed here and not above
      # because sync-mistral.mjs is the only consumer of it.
      #
      # `continue-on-error` because this job's product is a REVIEWABLE DIFF,
      # and one vendor must not be able to withhold the other six. Observed
      # while wiring this up: sync-xai.mjs answers a *present but rejected*
      # key with a hard 403 → exit 1 (exit 2 is only the key-absent path), so
      # a single expired secret would abort the step, skip the snapshot
      # refresh + drift detection below, and open no PR at all — even though
      # six vendors had already written their updates to disk. The failure
      # stays visible as a red step with an annotation; it just doesn't
      # swallow the run. run-all.mjs already runs every script before
      # reporting, so the on-disk drift is complete either way.
      - name: Regenerate native vendor lists
        if: ${{ github.event_name == 'schedule' || inputs.refresh }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          # sync-openai.mjs takes its id list from api.openai.com/v1/models
          # when this is set. Unlike the other keys here its absence is not
          # even a skip: the script still runs, prices from OpenAI's published
          # pricing page, and falls back to OpenRouter's openai/* ids — the
          # behaviour it had before it had a key at all.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: pnpm catalog:sync-native

      # Some synced prices are asserted by snapshot rather than by a hardcoded
      # pin (the OpenRouter-routed Kimi rows — see
      # packages/model-catalog/src/__tests__/catalog.test.ts), precisely so
      # that drift reads as a reviewable diff instead of a red CI pin. That
      # only works if something rewrites the snapshot when the generated file
      # moves: the test's own comment claimed this job did, but nothing did,
      # so every sync touching a snapshotted price opened a PR that was red on
      # arrival (#1313: kimi-k3 3/15 → 2.648138/13.282724). `-u` rewrites
      # snapshots only — a real generator bug (wrong vendor/provider, a
      # pricing shape that vanished) is asserted by hardcoded expectations and
      # still fails here, and again on the PR's own Build + test.
      - name: Refresh catalog test snapshots
        run: pnpm --filter @agentproto/model-catalog exec vitest run -u

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No catalog drift — nothing to sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Catalog drift detected" >> "$GITHUB_STEP_SUMMARY"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      # changeset-check (ci.yml) fails a PR that touches a publishable package
      # without a changeset, and this PR always touches @agentproto/model-catalog.
      # Nothing was writing one: the reviewer that normally auto-generates
      # changesets doesn't run on this bot-authored PR, so it could never go
      # green on its own. Written deterministically here — the change is always
      # the same shape (regenerated provider data, patch bump), so it needs no
      # LLM the way scripts/auto-changeset.mjs does.
      - name: Write changeset for the drifted packages
        if: steps.drift.outputs.changed == 'true'
        run: node scripts/write-catalog-changeset.mjs

      # `--check` must stay green on every normal PR/CI run (committed
      # snapshots ⇒ committed generated files). This job is the *producer* of
      # that truth: it opens a PR whenever the upstream sources have drifted.
      - name: Open sync PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          branch: catalog-sync/auto
          base: main
          commit-message: "chore(catalog): sync generated data from pinned sources"
          title: "chore(catalog): sync generated catalog data"
          body: |
            Automated catalog regeneration from the pinned provider sources via
            `@agentproto/catalog-sync`.

            - Generated `*.generated.ts` (and refreshed snapshots, if `--refresh`)
              now differ from `main`.
            - Review the diff as you would any pricing/model change, then merge.
            - This data is **generated, not hand-edited** — to change it, change
              the generator or the pinned source, never the output file.
          labels: |
            catalog-sync
            automated
          delete-branch: true
