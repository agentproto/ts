name: Spec Packages Doc

# Regenerates docs/reference/spec-packages.md (one row per spec-reference
# package, see scripts/gen-spec-packages-doc.mjs) and, when it changed, opens
# or updates ONE pull request on a fixed branch. The doc is generated, never
# hand-edited and never committed per PR: ordinary PRs do not touch it, so a
# new package can no longer turn a PR red over a stale table. This job only
# proposes: it never pushes to main and never merges. A human merges the PR.
#
# Triggers:
#   - push to main: package metadata, schema headers or the generators moved
#   - workflow_dispatch: on demand (also how the doc is first created)

on:
  push:
    branches: [main]
    paths:
      - "packages/**/package.json"
      - "packages/**/src/schema.ts"
      - "adapters/*/package.json"
      - "scripts/gen-status.mjs"
      - "scripts/gen-spec-packages-doc.mjs"
      - ".github/workflows/spec-packages-doc.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write # push the doc branch
  pull-requests: write # open the doc PR

jobs:
  regenerate:
    name: Regenerate spec packages doc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Same App the other PR-writing jobs use (aip-sync, catalog-sync). A PR
      # opened with the default GITHUB_TOKEN does not trigger CI, so the App
      # token is what lets the doc PR get checks. Falls back to GITHUB_TOKEN
      # when no App is configured.
      - name: Mint bot token (GitHub App, optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Plain node, no dependencies: the generators read package.json files
      # and src/schema.ts headers only, so no `pnpm install` is needed.
      - name: Generate the doc
        run: node scripts/gen-spec-packages-doc.mjs

      - name: Detect drift
        id: drift
        run: |
          if [ -z "$(git status --porcelain -- docs/reference/spec-packages.md)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "docs/reference/spec-packages.md is up to date, nothing to propose."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Spec packages doc changed" >> "$GITHUB_STEP_SUMMARY"
            git diff --stat -- docs/reference/spec-packages.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the doc PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          branch: bot/spec-packages-doc
          base: main
          add-paths: docs/reference/spec-packages.md
          commit-message: "docs: refresh the spec packages reference"
          title: "docs: refresh the spec packages reference"
          body: |
            Automated refresh of `docs/reference/spec-packages.md`, generated by
            `scripts/gen-spec-packages-doc.mjs` from the `spec-reference` tier of
            `scripts/gen-status.mjs`.

            - Generated, not hand-edited: to change a row, change the package's
              `package.json` or the generator, never the doc.
            - This single PR is updated in place on every run; merge it when
              convenient.
          labels: |
            automated
          delete-branch: true
