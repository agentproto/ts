name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first — `tsc --noEmit` resolves workspace package imports
      # through their published `.d.ts` files in `dist/`, which only
      # exist after `pnpm build`. Running `check-types` before `build`
      # produced "Cannot find module '@agentproto/<pkg>'" cascades on
      # every commit since the multi-package extraction.
      - name: Build all packages
        run: pnpm build

      - name: Type-check all packages
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

  # On PRs: verify a changeset was added. Quick git-only check that
  # runs in parallel with build-and-test to give fast feedback.
  # If the changeset is missing, pr-review will generate one after
  # build-and-test passes — its commit re-triggers CI, making this pass.
  changeset-check:
    name: Changeset present?
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" == chore\(release\):* ]]; then
            echo "Version Packages PR — no changeset required."
            exit 0
          fi
          ADDED=$(git diff --diff-filter=A --name-only origin/main...HEAD -- '.changeset/*.md' \
            | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$ADDED" ]; then
            echo "No changeset found. Run 'pnpm changeset' locally or wait for pr-review to generate one."
            exit 1
          fi
          echo "✓ Changeset present: $ADDED"

  # On PRs: agentic reviewer — reads the full diff, greps the codebase,
  # writes an accurate changeset, and posts a structured review.
  # Runs after build-and-test so it never reviews a broken build.
  # The reviewer writes the changeset; the changeset commit re-triggers CI
  # so the "Agentic review" check lands on the new HEAD (Part A makes that
  # re-run idempotent — no second changeset commit is produced).
  pr-review:
    name: Agentic review
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write       # push generated changeset back to the branch
      pull-requests: write  # post review + comments
      statuses: write       # post explicit commit-status on HEAD after push
    steps:
      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout branch (with write token)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.bot.outputs.token || secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run agentic PR reviewer
        run: node scripts/review-pr.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Commit changeset (if written by reviewer)
        id: changeset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '.changeset/*.md'
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changeset changes to commit."
          else
            # [skip ci] prevents a redundant build cycle — explicit statuses
            # below cover both "Agentic review" and "Changeset present?" on
            # the new HEAD, so the merge gate stays green without a second run.
            git commit -m "chore: agentic reviewer — changeset [skip ci]"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Gate: resolve decision + blocking config, post explicit statuses on
      # HEAD for both "Agentic review" and "Changeset present?" so the merge
      # gate is covered even when [skip ci] suppresses a new CI run.
      # Three steps so pr-fix (always()) still sees a red job and triggers.
      - name: Resolve review decision + blocking config
        id: gate
        run: |
          DECISION=$(gh pr view "$PR_NUMBER" --json reviewDecision -q '.reviewDecision')
          BLOCKING="${{ vars.AGENTIC_REVIEW_BLOCKING }}"
          if [ -z "$BLOCKING" ] && [ -f .github/agentic-review.json ]; then
            BLOCKING=$(node -p "String(require('./.github/agentic-review.json').blocking ?? '')" 2>/dev/null || echo "")
          fi
          [ -z "$BLOCKING" ] && BLOCKING="true"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
          if [ "$BLOCKING" = "true" ] && [ "$DECISION" = "CHANGES_REQUESTED" ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Post explicit statuses on PR HEAD
        run: |
          SHA=$(git rev-parse HEAD)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f context="Agentic review" \
            -f state="${{ steps.gate.outputs.state }}" \
            -f target_url="$RUN_URL" \
            -f description="decision=${{ steps.gate.outputs.decision }} blocking=${{ steps.gate.outputs.blocking }}"
          # Mirror "Changeset present?" so the merge gate stays green after a
          # [skip ci] changeset commit (which suppresses the changeset-check job).
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f context="Changeset present?" \
            -f state="success" \
            -f target_url="$RUN_URL" \
            -f description="written by agentic reviewer"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate — fail run if blocking changes requested
        if: steps.gate.outputs.state == 'failure'
        run: |
          echo "::error::Agentic reviewer requested changes (blocking mode) — merge blocked until fixes or admin force-merge."
          exit 1

  # On PRs: if pr-review posted CHANGES_REQUESTED, apply the fixes automatically.
  # Runs after pr-review; checks the live review decision before spending tokens.
  # The fix commit (no [skip ci]) re-triggers the full CI cycle, including pr-review,
  # creating the review-fix loop. Loop is bounded by MAX_ITER in apply-review.mjs.
  # always() is required so this job runs even when pr-review fails (gate step exits 1).
  pr-fix:
    name: Auto-fix from review
    runs-on: ubuntu-latest
    needs: [pr-review]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write        # commit + push fixes back to the branch
      pull-requests: write   # post escalation comment when loop is exhausted
    steps:
      - name: Check review decision
        id: decision
        run: |
          DECISION=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json reviewDecision -q '.reviewDecision')
          echo "Review decision: $DECISION"
          echo "value=$DECISION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED' && vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout branch (with write token)
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.bot.outputs.token || secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The auto-fix loop is pinned to commit-mode (push onto the PR branch) so
      # the review→fix→re-review cycle stays tight. Stacked-PR delivery is an
      # on-demand choice via `/fix --pr` (config.fixDelivery sets that default).
      - name: Apply review fixes
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        run: node scripts/apply-review.mjs --delivery commit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Commit and push fixes
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit (loop exhausted — escalation was posted)."
          else
            ITER=$(git log --oneline --grep="auto-fix from review" origin/main..HEAD \
              | wc -l | tr -d ' ')
            NEXT=$((ITER + 1))
            git commit -m "chore: auto-fix from review (iter $NEXT)"
            git push
          fi

