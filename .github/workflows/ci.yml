name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # Build first — `tsc --noEmit` resolves workspace package imports
      # through their published `.d.ts` files in `dist/`, which only
      # exist after `pnpm build`. Running `check-types` before `build`
      # produced "Cannot find module '@agentproto/<pkg>'" cascades on
      # every commit since the multi-package extraction.
      - name: Build all packages
        run: pnpm -r --filter "./packages/**" --filter "./adapters/**" build

      - name: Type-check all packages
        run: pnpm -r --filter "./packages/**" --filter "./adapters/**" check-types

      - name: Run tests
        run: pnpm -r --filter "./packages/**" --filter "./adapters/**" test
