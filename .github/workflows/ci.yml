name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Default types (opened/synchronize/reopened) plus ready_for_review, so a
    # PR flipped from draft to ready deterministically re-enters this flow
    # (review-if-needed → merge-gate) instead of the handoff dead-ending.
    types: [opened, synchronize, reopened, ready_for_review]

# ── Concurrency ───────────────────────────────────────────────────────────
# Per-job, not workflow-level: the agentic reviewer (pr-review) runs for
# several minutes and is cancelled when another push lands on the branch
# (including CI's own changeset commit). Workflow-level cancel-in-progress
# kills the running review → review never posts → changeset commit was
# pointless. Instead, each job declares its own policy:
#   - fast deterministic jobs (build/test/hygiene/changeset) may cancel
#   - pr-review NEVER cancels — wait for it to finish
#   - pr-fix / auto-merge queue behind pr-review's group

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # turbo's --affected diffs origin/main...HEAD to scope work to
          # changed packages + dependents. That range must be fully present
          # in the checkout, or turbo safely (silently) falls back to
          # treating every package as affected — fetch-depth: 0 is load
          # bearing, not cosmetic.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first — `tsc --noEmit` resolves workspace package imports
      # through their published `.d.ts` files in `dist/`, which only
      # exist after `pnpm build`. Running `check-types` before `build`
      # produced "Cannot find module '@agentproto/<pkg>'" cascades on
      # every commit since the multi-package extraction.
      #
      # `vars.CI_AFFECTED_ONLY` (repo variable, Settings → Variables) is
      # the quick on/off switch: "false" reverts these three steps to the
      # full unscoped `pnpm build`/`check-types`/`test` — no code change,
      # no redeploy, just flip the variable — if turbo's affected-scoping
      # or the remote cache ever misbehaves.
      #
      # The affected path only applies on `pull_request` — on `push` (i.e.
      # post-merge to main) HEAD already IS origin/main's tip, so
      # `origin/main...HEAD` is empty and `--affected` would find nothing,
      # silently no-op-ing the one run that's supposed to catch two
      # individually-fine PRs combining into a broken main. Push events
      # always get the full unscoped run.
      - name: Build all packages
        run: |
          if [ "${{ github.event_name == 'pull_request' && vars.CI_AFFECTED_ONLY != 'false' }}" = "true" ]; then
            pnpm exec turbo run build --affected --filter="./packages/**" --filter="./adapters/**"
          else
            pnpm build
          fi
        env:
          TURBO_API: https://turbo-cache-f5mennea6a-ew.a.run.app
          TURBO_TEAM: agentproto-ts
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: origin/main

      - name: Type-check all packages
        run: |
          if [ "${{ github.event_name == 'pull_request' && vars.CI_AFFECTED_ONLY != 'false' }}" = "true" ]; then
            pnpm exec turbo run check-types --affected --filter="./packages/**" --filter="./adapters/**"
          else
            pnpm check-types
          fi
        env:
          TURBO_API: https://turbo-cache-f5mennea6a-ew.a.run.app
          TURBO_TEAM: agentproto-ts
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: origin/main

      # `pnpm test`'s `pretest` hook (package.json) runs this doc-coverage
      # check before the actual tests. The turbo path below calls `pnpm exec
      # turbo run test` directly, which does NOT go through the `pnpm test`
      # npm script and so would silently skip that hook — run it explicitly
      # instead, only on the turbo path (the full-scope path below still
      # gets it for free via the lifecycle hook; running both would just
      # duplicate the check).
      - name: Check CLI docs coverage (pretest)
        if: github.event_name == 'pull_request' && vars.CI_AFFECTED_ONLY != 'false'
        run: node scripts/agentflow/docs.mjs --check

      - name: Run tests
        run: |
          if [ "${{ github.event_name == 'pull_request' && vars.CI_AFFECTED_ONLY != 'false' }}" = "true" ]; then
            pnpm exec turbo run test --affected --filter="./packages/**" --filter="./adapters/**"
          else
            pnpm test
          fi
        env:
          TURBO_API: https://turbo-cache-f5mennea6a-ew.a.run.app
          TURBO_TEAM: agentproto-ts
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: origin/main

      # `pnpm test` only covers packages/** and adapters/**, so the release
      # tooling in scripts/ would otherwise ship untested. These guard the
      # @agentproto/cli@0.5.0 incident (a console trace published as a release
      # body) and the model-invented release date behind it.
      - name: Run release-tooling tests
        run: node --test scripts/release-notes.test.mjs

      # Guards docs-check.mjs's PreToolUse path-confinement guard — an
      # unattended `bypassPermissions` SDK run that reads/edits doc files is
      # otherwise not sandboxed to the repo root (verified live: a run read
      # files well outside its repo). See scripts/lib/path-confine.mjs.
      - name: Run docs-check confinement tests
        run: node --test scripts/path-confine.test.mjs

      # Guards the cli-docs coverage detector (scripts/agentflow/docs.mjs) that
      # gates `pnpm test` via pretest — the verb-set parse + stale-version regex
      # ship untested otherwise, and a silent-empty parse would neuter the gate.
      - name: Run cli-docs coverage tests
        run: node --test scripts/agentflow/docs.test.mjs

      # Guards check-changesets' name-resolution + --fix auto-heal (the reviewer
      # writes changesets by guessing the package name; --fix corrects an
      # unambiguous scope↔dash near-miss before it lands).
      - name: Run changeset-check tests
        run: node --test scripts/check-changesets.test.mjs scripts/check-changeset-coverage.test.mjs scripts/list-changed-packages.test.mjs

      # `changeset version` only runs on main, after the merge, and hard-errors
      # on a package name that isn't in the workspace — so one bad changeset
      # takes down every release until a human notices. pr-338-review declared
      # "@agentproto/vscode" (the package is `agentproto-vscode`) and broke 8
      # consecutive Release runs. Changesets are usually written by the agentic
      # reviewer guessing the name from context; check the guess here, on the PR
      # that introduces it, not an hour later in a dead release. The reviewer's
      # commit step runs `--fix` first, so a resolvable near-miss self-heals and
      # only a genuinely-unknown name reaches this hard gate.
      - name: Validate changeset package names
        run: node scripts/check-changesets.mjs

  # On PRs: verify a changeset was added. Quick git-only check that
  # runs in parallel with build-and-test to give fast feedback.
  # If the changeset is missing, pr-review will generate one after
  # build-and-test passes — its commit re-triggers CI, making this pass.
  changeset-check:
    name: Changeset present?
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for changeset
        # Pass the PR title via env, NOT inline `${{ … }}` interpolation into the
        # script body — a title containing backticks / $( ) would otherwise be
        # executed by the shell (command injection; e.g. a title with
        # `agentproto models` failed this step with "command not found", 127).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TITLE="$PR_TITLE"
          if [[ "$TITLE" == chore\(release\):* ]]; then
            echo "Version Packages PR — no changeset required."
            exit 0
          fi
          # A changeset is only required when a publishable package changed.
          # PRs that touch only scripts/, .github/, root configs, etc. ship no
          # npm version bump — mirror the reviewer's rule and skip the gate so
          # these don't show a (non-blocking but ugly) red check.
          PKG_CHANGES=$(git diff --name-only origin/main...HEAD -- 'packages/**' 'adapters/**' || true)
          if [ -z "$PKG_CHANGES" ]; then
            echo "No @agentproto/* package changes — no changeset required."
            exit 0
          fi
          # Private packages (agentproto-vscode, agentproto-desktop, …) ship via
          # the VS Code Marketplace / platform installers on their own cadence,
          # not npm — scripts/auto-changeset.mjs already excludes them (its
          # `!priv` filter) since it would never have a changeset to write for
          # them. Mirror that here: drop changed paths under any top-level
          # packages/**|adapters/** dir whose package.json has "private": true,
          # then only require a changeset if publishable paths remain.
          PRIVATE_PREFIXES=$(
            find packages adapters -maxdepth 2 -name package.json -not -path '*/node_modules/*' 2>/dev/null \
              | while read -r pkgJson; do
                  if jq -e '.private == true' "$pkgJson" >/dev/null 2>&1; then
                    dirname "$pkgJson"
                  fi
                done
          )
          PUBLISHABLE_CHANGES="$PKG_CHANGES"
          for prefix in $PRIVATE_PREFIXES; do
            PUBLISHABLE_CHANGES=$(echo "$PUBLISHABLE_CHANGES" | grep -v "^${prefix}/" || true)
          done
          if [ -z "$PUBLISHABLE_CHANGES" ]; then
            echo "Only private-package changes ($PKG_CHANGES) — these ship via Marketplace/installers, not npm; no changeset required."
            exit 0
          fi
          ADDED=$(git diff --diff-filter=A --name-only origin/main...HEAD -- '.changeset/*.md' \
            | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$ADDED" ]; then
            echo "Package changes present but no changeset. Run 'pnpm changeset' / 'pnpm changeset:ai', or wait for pr-review to generate one."
            exit 1
          fi
          echo "✓ Changeset present: $ADDED"

      - name: Every changed package is bumped (coverage)
        # The presence check above only verifies that *a* changeset exists.
        # This verifies that EVERY changed publishable package is named in one —
        # the gap that stranded @agentproto/auth (changed by #470 but not
        # bumped → never republished → cli@latest crashed on the missing
        # `eligibleProfiles` export). Dependency-free node; self-gating on
        # timing (no-ops until a changeset exists, since pr-review writes it
        # after the first push).
        # Pass PR_TITLE via env, not inline `${{ … }}` interpolation — see the
        # "Check for changeset" step above for why (shell injection via backticks).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          TITLE="$PR_TITLE"
          if [[ "$TITLE" == chore\(release\):* ]]; then
            echo "Version Packages PR — coverage check skipped."
            exit 0
          fi
          node scripts/check-changeset-coverage.mjs origin/main

  # On PRs: enforce two conventions that used to rely on remembering to say
  # them in every prompt — no per-worktree scratch docs land in the repo, and
  # no AI-attribution trailers ride into commits or PR bodies. Fast,
  # pure-git/shell, runs in parallel with build-and-test.
  hygiene-check:
    name: Hygiene checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for scratch docs and AI-attribution trailers
        # Pass PR_TITLE via env, not inline `${{ … }}` interpolation — see the
        # changeset-check step above for why (shell injection via backticks).
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="$PR_TITLE"
          if [[ "$TITLE" == chore\(release\):* ]]; then
            echo "Version Packages PR — hygiene checks skipped."
            exit 0
          fi

          FAIL=0
          # Match on the email domain, not the display name — a human
          # contributor named "Claude" (or similar) must not false-positive.
          ATTRIBUTION_PATTERN='Co-authored-by:.*@anthropic\.com|Co-authored-by:.*claude\.ai|Generated with'

          # 1. Root-level scratch docs (PLAN.md, BRIEF.md, MERGE-CONFLICT-BRIEF*.md)
          # are per-worktree planning scratch and must never land in the repo —
          # they've collided across sibling branches repeatedly. Check the
          # checked-out HEAD tree directly (not the diff), so one that slipped
          # in via a bad merge is still caught, not just ones added in this PR.
          SCRATCH_FILES=()
          for f in PLAN.md BRIEF.md MERGE-CONFLICT-BRIEF*.md; do
            if [ -f "$f" ]; then
              SCRATCH_FILES+=("$f")
            fi
          done
          if [ "${#SCRATCH_FILES[@]}" -gt 0 ]; then
            echo "::error::Root-level scratch doc(s) present in this PR's tree: ${SCRATCH_FILES[*]}"
            echo "These are per-worktree planning scratch files (PLAN.md / BRIEF.md / MERGE-CONFLICT-BRIEF*.md) and must never be committed to the repo."
            echo "Fix: git rm ${SCRATCH_FILES[*]}"
            FAIL=1
          fi

          # 2. No AI-attribution trailer in any commit in this PR's range, or in
          # the PR body. Forward-looking only — commits already on main before
          # this convention existed are never scanned.
          BAD_COMMITS=$(git log --format=%B origin/main..HEAD | grep -iE "$ATTRIBUTION_PATTERN" || true)
          if [ -n "$BAD_COMMITS" ]; then
            echo "::error::A commit in this PR carries an AI-attribution trailer."
            echo "Commit messages must not carry AI-attribution footers (e.g. 'Co-Authored-By: Claude ...', 'Generated with ...'). Amend/rebase to remove them."
            echo "Matched line(s): $BAD_COMMITS"
            FAIL=1
          fi

          PR_BODY=$(gh pr view "$PR_NUMBER" --json body -q .body || true)
          if printf '%s' "$PR_BODY" | grep -iE "$ATTRIBUTION_PATTERN" > /dev/null; then
            echo "::error::The PR body carries an AI-attribution trailer."
            echo "PR bodies must not carry AI-attribution footers (e.g. 'Co-Authored-By: Claude ...', 'Generated with ...'). Edit the PR description to remove them."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            exit 1
          fi
          echo "✓ No scratch docs, no AI-attribution trailers."

  # On PRs: conformance tests for the auto-merge decision logic
  # (scripts/agentflow/merge-gate.mjs) — no workspace deps, so this runs
  # standalone without a full pnpm install. This is the test that would have
  # caught the 2026-07-15 incident: draft+APPROVED+var=true must hold, not arm.
  merge-gate-test:
    name: Merge-gate conformance tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # No pnpm install here on purpose: merge-gate.mjs and its test use only
      # node:child_process/node:fs/node:test, zero workspace deps. setup-node@v5
      # defaults package-manager-cache to true and auto-detects the root
      # package.json's `packageManager: pnpm@…` field regardless — without this
      # override it tries to prime a pnpm cache via a pnpm binary this job never
      # installs (see the sibling `Setup pnpm` step in build-and-test) and fails.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run merge-gate conformance tests
        run: node --test scripts/agentflow/merge-gate.test.mjs

  # On PR open: fill an empty description from the diff (never clobbers a
  # human/agent-written body). Opt-in via describe.auto in agentic-review.json.
  describe:
    name: Describe PR
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5 # bootstrap: load the local composite action
      - uses: ./.github/actions/agent-setup
        id: setup
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fill PR description (if empty + enabled)
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          AUTO=$(node -p "String((require('./.github/agentic-review.json').describe||{}).auto ?? '')" 2>/dev/null || echo "")
          if [ "$AUTO" != "true" ]; then echo "describe.auto is off — skipping."; exit 0; fi
          node scripts/describe-pr.mjs --pr "$PR_NUMBER"

  # On PRs: agentic reviewer — reads the full diff, greps the codebase,
  # writes an accurate changeset, and posts a structured review.
  # Runs after build-and-test so it never reviews a broken build.
  # The reviewer writes the changeset; the changeset commit re-triggers CI
  # so the "Agentic review" check lands on the new HEAD (Part A makes that
  # re-run idempotent — no second changeset commit is produced).
  pr-review:
    name: Agentic review
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    # Own concurrency group — must NOT cancel-in-progress.
    # The reviewer pushes a changeset commit back to the PR branch, which
    # re-triggers CI. The workflow-level concurrency cancels every in-flight
    # PR run (including THIS job) on each push → the review self-cancels.
    # Giving pr-review its own group with cancel-in-progress:false lets the
    # review finish posting even after its own changeset push re-triggers CI.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-review
      cancel-in-progress: false
    permissions:
      contents: write       # push generated changeset back to the branch
      pull-requests: write  # post review + comments
      statuses: write       # post explicit commit-status on HEAD after push
    steps:
      - uses: actions/checkout@v5 # bootstrap: load the local composite action

      # The re-triggered run (from the reviewer's changeset commit) can race
      # GitHub auto-merge, which merges the PR and deletes its branch. Every
      # branch-dependent step below then fails on a dead-branch checkout
      # (`agent-setup` does `ref: github.head_ref`). Query the LIVE PR state
      # here — the bootstrap checkout above works post-merge and this `gh`
      # call needs no branch — and skip the rest of the job if it's gone.
      - name: Skip if PR already merged/closed
        id: prstate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MERGED=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json state,mergedAt \
            --jq 'if (.mergedAt != null) or (.state != "OPEN") then "true" else "false" end')
          echo "skip=$MERGED" >> "$GITHUB_OUTPUT"
          if [ "$MERGED" = "true" ]; then echo "PR no longer open — skipping branch-dependent steps."; fi

      - uses: ./.github/actions/agent-setup
        id: setup
        if: steps.prstate.outputs.skip != 'true'
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}
          pnpm: 'true'

      # Capture the PR head SHA the reviewer will actually SEE, before
      # anything can move HEAD (the sandboxed reviewer pushes its changeset to
      # the head branch from inside the box; the host-side "Commit changeset"
      # step pushes too). The posted review's `commit_id` is stamped at post
      # time against THIS sha — the verify step below matches on it.
      - name: Capture PR head SHA
        id: headsha
        if: steps.prstate.outputs.skip != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Feed the reviewer its last-reviewed commit + prior review body so it can
      # review only the increment (last reviewed SHA → HEAD) instead of the full
      # PR diff every push. gh is available host-side (the e2b box has none), so
      # resolve it here and pass it into the workflow input.
      - name: Find last reviewed commit
        id: lastreview
        if: steps.prstate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.headsha.outputs.sha }}
          BOT_SLUG: ${{ steps.setup.outputs.app-slug }}
        run: |
          # --paginate + `jq -s add` (per-page eval otherwise miscounts, matches
          # the postcheck step's recipe).
          REVIEWS=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" | jq -s 'add')
          # Prefer the bot's own prior reviews (author login starts with the app
          # slug), against a DIFFERENT sha than HEAD; fall back to any review with
          # a commit_id if the bot has none yet. Latest by submitted_at wins.
          LAST=$(echo "$REVIEWS" | jq -r --arg head "$HEAD_SHA" --arg slug "$BOT_SLUG" '
            def pick(f): [ .[] | select(.commit_id != null and .commit_id != "" and .commit_id != $head) | select(f) ] | sort_by(.submitted_at) | last;
            (pick(.user.login | startswith($slug)) // pick(true)) // {} | .commit_id // ""')
          BODY=$(echo "$REVIEWS" | jq -r --arg last "$LAST" '[ .[] | select(.commit_id == $last) ] | sort_by(.submitted_at) | last // {} | .body // ""')
          echo "sha=$LAST" >> "$GITHUB_OUTPUT"
          {
            echo "body<<__AGENTFLOW_EOF__"
            echo "$BODY"
            echo "__AGENTFLOW_EOF__"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$LAST" ]; then echo "Prior review found at $LAST"; else echo "No prior review — full-diff review."; fi

      # agentflow bypass: if the dev ran `review:ai --stamp` locally, an
      # empty `[agentflow-reviewed]` marker commit rides the branch. Honor it
      # and skip the cloud reviewer (the dev vouched + ran local changeset).
      # Trust note: any commit in-range can carry the marker, so this is a
      # convenience for trusted contributors, not a security boundary.
      - name: Check local-review bypass
        id: bypass
        if: steps.prstate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # origin/main is fetched by the agent-setup harness. Fail-safe: if the
          # range can't resolve, skip stays false and the cloud reviewer runs.
          #
          # The reviewer's own changeset commit re-triggers CI (it can't use
          # [skip ci] — that token rides into the squash-merge body and skips the
          # Release workflow, see the "Commit changeset" step). That re-run would
          # otherwise review byte-identical code a second time: the first run
          # already reviewed it and mirrored the "Agentic review"/"Changeset
          # present?" statuses onto this HEAD (see "Post explicit statuses"), and
          # the gate below treats a bypass as success. So skip the redundant
          # second review when HEAD is exactly that changeset commit. (Build+test
          # / hygiene still re-run — cheap, and the code is unchanged anyway.)
          if [ "$(git log -1 --format='%s')" = "chore: agentic reviewer — changeset" ]; then
            # The bypass assumes the reviewer already reviewed the PARENT commit
            # (the code this changeset was written for) and mirrored its statuses.
            # But a reviewer that wrote the changeset yet posted NO review (a
            # review-post no-op) would otherwise slip through as a FALSE GREEN
            # (PR #625). Only trust the bypass if a real review exists for HEAD^.
            PARENT_SHA="$(git rev-parse HEAD^)"
            REVIEW_COUNT="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/reviews" | jq -s "add | [.[] | select(.commit_id==\"$PARENT_SHA\")] | length")"
            if [ "${REVIEW_COUNT:-0}" -gt 0 ] 2>/dev/null; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "HEAD is the reviewer's changeset commit; parent $PARENT_SHA has $REVIEW_COUNT review(s) — skipping the re-review."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "::warning::HEAD is the changeset commit but parent $PARENT_SHA has no posted review — refusing the bypass (would be a false green); running the real review."
            fi
          elif git log origin/main..HEAD --format='%B' | grep -qF '[agentflow-reviewed]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Local-review marker found — skipping the cloud reviewer."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load agentic-review config
        id: config
        if: steps.prstate.outputs.skip != 'true'
        run: |
          if [ -f .github/agentic-review.json ]; then
            echo "json=$(jq -c . .github/agentic-review.json)" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "json={}" >> "$GITHUB_OUTPUT"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine review mode
        id: mode
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true'
        run: |
          # The agentproto lane can bill either way (reviewerAuthMode in
          # .github/agentic-review.json): subscription rides the OAuth token,
          # api-key rides ANTHROPIC_API_KEY (also what the e2b sandbox
          # passthrough injects). Either credential qualifies the lane;
          # legacy only when BOTH are absent.
          if [ -n "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ] || [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "mode=agentproto" >> "$GITHUB_OUTPUT"
            echo "Using agentproto lane"
          else
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "No reviewer credential — falling back to legacy API-key reviewer"
          fi

      - name: Resolve agentproto CLI source/version
        id: cliver
        if: steps.prstate.outputs.skip != 'true'
        run: |
          CLI_SOURCE=$(node -p "String((require('./.github/agentic-review.json').cliSource) || 'npm')" 2>/dev/null || echo "npm")
          CLI_VERSION=$(node -p "String((require('./.github/agentic-review.json').cliVersion) || '0.8.0')" 2>/dev/null || echo "0.8.0")
          # Billing-auth mode for the reviewer's adapter. subscription/OAuth
          # needs an interactive ~/.claude login the CI runner doesn't have and
          # no-ops with "Authentication required"; api-key authenticates headless.
          AUTH_MODE=$(node -p "String((require('./.github/agentic-review.json').reviewerAuthMode) || 'subscription')" 2>/dev/null || echo "subscription")
          # Reviewer adapter. claude-code drives the Claude Code CLI, which
          # no-ops headless in CI; claude-sdk is SDK-based and authenticates
          # headless (and can front Moonshot/Kimi via ANTHROPIC_BASE_URL).
          ADAPTER=$(node -p "String((require('./.github/agentic-review.json').reviewerAdapter) || 'claude-code')" 2>/dev/null || echo "claude-code")
          echo "cli-source=$CLI_SOURCE" >> "$GITHUB_OUTPUT"
          echo "cli-version=$CLI_VERSION" >> "$GITHUB_OUTPUT"
          echo "auth-mode=$AUTH_MODE" >> "$GITHUB_OUTPUT"
          echo "adapter=$ADAPTER" >> "$GITHUB_OUTPUT"
          echo "Using agentproto CLI source=$CLI_SOURCE (version=$CLI_VERSION) adapter=$ADAPTER auth-mode=$AUTH_MODE"

      - name: Build local agentproto CLI
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.cliver.outputs.cli-source == 'workspace'
        run: |
          pnpm install --frozen-lockfile
          pnpm build --filter @agentproto/cli... --filter "@agentproto/adapter-${{ steps.cliver.outputs.adapter }}..."
        env:
          TURBO_API: https://turbo-cache-f5mennea6a-ew.a.run.app
          TURBO_TEAM: agentproto-ts
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_SCM_BASE: origin/main

      # Seed claude-code's trust/onboarding state so it doesn't hit an
      # interactive trust dialog headless (a clean runner has no ~/.claude.json,
      # so Claude Code raises a trust prompt and the turn comes back empty).
      - name: Seed claude-code trust/onboarding (headless)
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true' &&
          steps.mode.outputs.mode == 'agentproto' &&
          steps.cliver.outputs.adapter == 'claude-code'
        run: |
          node -e '
            const fs=require("fs"),os=require("os"),path=require("path");
            const p=path.join(os.homedir(),".claude.json");
            let c={}; try{c=JSON.parse(fs.readFileSync(p,"utf8"))}catch{}
            c.hasCompletedOnboarding=true;
            c.projects=c.projects||{};
            const cwd=process.env.GITHUB_WORKSPACE;
            c.projects[cwd]=Object.assign({},c.projects[cwd],{hasTrustDialogAccepted:true,hasCompletedProjectOnboarding:true});
            fs.writeFileSync(p,JSON.stringify(c,null,2));
            console.log("seeded "+p+" (onboarding + trust) for "+cwd);
          '

      # OAuth path: agentproto-run lane (subscription billing, flat rate).
      # Falls back to legacy on any failure so a token expiry doesn't block merges.
      - name: Run agentic PR reviewer (agentproto lane)
        id: reviewer-agentproto
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true' &&
          steps.mode.outputs.mode == 'agentproto'
        continue-on-error: true
        uses: ./.github/actions/agentproto-run
        env:
          GITHUB_TOKEN: ${{ steps.setup.outputs.token }}
        with:
          adapter: ${{ steps.cliver.outputs.adapter }}
          # auth-mode from .github/agentic-review.json (reviewerAuthMode).
          # Both credentials are passed; the action's write-config uses only
          # the one matching auth-mode. api-key authenticates headless in CI
          # (subscription/OAuth silently no-ops without an interactive login).
          auth-mode: ${{ steps.cliver.outputs.auth-mode }}
          oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # e2b microVM sandbox for the reviewer session (reviewerSandbox in
          # .github/agentic-review.json) — the daemon-internal spawn failure on
          # the runner does not reproduce inside a sandbox, whose own daemon
          # spawns the adapter.
          e2b-api-key: ${{ secrets.E2B_API_KEY }}
          # Langfuse session tracing for the reviewer (HOST daemon emits — it
          # owns the proxied sandbox session). All-or-nothing: missing secrets
          # ⇒ tracing silently skipped, never a red review.
          langfuse-public-key: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          langfuse-secret-key: ${{ secrets.LANGFUSE_SECRET_KEY }}
          langfuse-base-url: ${{ secrets.LANGFUSE_BASE_URL }}
          langfuse-project: ${{ secrets.LANGFUSE_PROJECT }}
          workflow-path: .github/agentproto-workflows/pr-review/WORKFLOW.md
          cli-source: ${{ steps.cliver.outputs.cli-source }}
          cli-version: ${{ steps.cliver.outputs.cli-version }}
          workflow-input: |
            {
              "prNumber": ${{ github.event.pull_request.number }},
              "baseRef": "${{ github.base_ref }}",
              "repo": "${{ github.repository }}",
              "lastReviewedSha": "${{ steps.lastreview.outputs.sha }}",
              "priorReviewBody": ${{ toJSON(steps.lastreview.outputs.body) }},
              "githubToken": "${{ steps.setup.outputs.token }}",
              "reviewConfig": ${{ toJSON(fromJSON(steps.config.outputs.json || '{}')) }}
            }
          timeout-minutes: 15

      # The native lane can POST its review and STILL report failure — the
      # box session erroring during post-review wind-down (changeset delivery)
      # after the curl-REST post already landed. Observed live on PR #494:
      # native review posted 02:55:33, turn error 02:56:34, redundant legacy
      # review 02:58:07. Ask the API whether a review already exists for the
      # reviewed SHA BEFORE arming the fallback: a posted review means the
      # lane succeeded in substance and the fallback would only duplicate it
      # (and bill a second review).
      - name: Check whether a review was already posted (fallback gate)
        id: postcheck
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true' &&
          steps.mode.outputs.mode == 'agentproto'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.headsha.outputs.sha }}
        run: |
          # --paginate + `jq -s add` is load-bearing: a naive `--paginate
          # --jq` evaluates per PAGE and can miscount.
          COUNT=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            | jq -s "add | [.[] | select(.commit_id==\"$SHA\")] | length")
          echo "Reviews already posted against reviewed SHA $SHA: $COUNT"
          if [ "$COUNT" -gt 0 ] 2>/dev/null; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agentic PR reviewer (legacy API-key fallback)
        id: reviewer-legacy
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true' &&
          steps.postcheck.outputs.posted != 'true' &&
          (steps.mode.outputs.mode == 'legacy' || steps.reviewer-agentproto.outcome == 'failure' || steps.reviewer-agentproto.outputs.status == 'failed')
        # Don't abort the job on a non-posting reviewer — capture the outcome so
        # the gate can turn it into an honest red instead of a false green.
        continue-on-error: true
        run: node scripts/review-pr.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the App token so the review + comments are authored by the
          # bot identity (mentionable) instead of github-actions[bot].
          GITHUB_TOKEN: ${{ steps.setup.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Propagate reviewer outcome for gate
        id: reviewer
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true'
        run: |
          # A posted review IS lane success, even when the native session
          # errored after posting (post-review wind-down — see the postcheck
          # step). The verify step below independently re-proves the review
          # row before the gate trusts this.
          if [ "${{ steps.reviewer-agentproto.outputs.status }}" = "done" ] \
            || [ "${{ steps.postcheck.outputs.posted }}" = "true" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
            echo "mode=agentproto" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.reviewer-legacy.outcome }}" = "success" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit changeset (if written by reviewer)
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true'
        id: changeset
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          BOT_SLUG: ${{ steps.setup.outputs.app-slug }}
        run: |
          # Attribute the commit to the App bot (mentionable identity) when an
          # App token was minted; fall back to github-actions[bot] otherwise.
          bash scripts/configure-bot-git.sh
          # Auto-heal a mis-scoped package name the reviewer guessed (e.g.
          # "@agentproto/vscode" → "agentproto-vscode") before it's committed,
          # so it doesn't red every later PR's changeset check the way
          # pr-379-review did. Deterministic near-miss only; a name with no
          # unique workspace match is left for the "Validate changeset package
          # names" gate. `|| true` so a leftover unresolvable name doesn't abort
          # the commit — that gate is what turns it red, honestly.
          node scripts/check-changesets.mjs --fix || true
          git add '.changeset/*.md'
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changeset changes to commit."
          else
            # Explicit statuses below already cover "Agentic review" and
            # "Changeset present?" on the new HEAD. No [skip ci] here — that
            # token ends up in squash-merge commit bodies and silently skips
            # the Release workflow after merge (GitHub checks the full message).
            git commit -m "chore: agentic reviewer — changeset"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Sweep the reviewer's per-PR scratch branch. The sandbox bootstrap fetches
      # the PR head into a LOCAL branch named `pr-<N>`
      # (.github/agentproto-workflows/lib/sandbox-agent.mjs) — the CI paths push
      # the changeset to the real head branch, never `pr-<N>`, but ad-hoc/local
      # lane runs that push the scratch branch leak an orphan `origin/pr-<N>` that
      # never becomes a PR and lingers. This deterministic sweep deletes it after
      # review: idempotent (no-op when absent) and guarded so it can never touch a
      # real head branch that happens to be named `pr-<N>`. Runs even when the PR
      # already merged (that's when the orphan most needs pruning), so it uses the
      # always-present GITHUB_TOKEN rather than the skip-gated App token.
      - name: Prune reviewer scratch branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          SCRATCH="pr-$PR_NUMBER"
          if [ "$SCRATCH" = "$HEAD_REF" ]; then
            echo "Head branch is literally $SCRATCH — refusing to delete a real PR head."
            exit 0
          fi
          # One idempotent call: DELETE the ref (plural `git/refs/{ref}` — the
          # canonical delete endpoint). A missing ref returns 404/422 → non-zero
          # → the else branch, so this needs no separate existence pre-check
          # (which would also have to use the SINGULAR `git/ref/{ref}` GET form,
          # an easy-to-misread inconsistency).
          if gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$SCRATCH" >/dev/null 2>&1; then
            echo "Pruned orphan scratch branch $SCRATCH."
          else
            echo "No scratch branch $SCRATCH — nothing to prune (or already gone)."
          fi

      # INDEPENDENT API-level guarantee that a review row actually exists for
      # the SHA the reviewer saw — belt-and-suspenders on top of the driver's
      # empty-turn/silent-no-op detection (which watches the SESSION, not the
      # GitHub side-effect). `--paginate` + `jq -s 'add'` is load-bearing: a
      # naive `--paginate --jq` evaluates PER PAGE and can false-pass on the
      # count. continue-on-error so the gate (not this step) decides the
      # job's fate with a clear error.
      - name: Verify review was posted
        id: verify
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.headsha.outputs.sha }}
        run: |
          COUNT=$(gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            | jq -s "add | [.[] | select(.commit_id==\"$SHA\")] | length")
          echo "Reviews posted against reviewed SHA $SHA: $COUNT"
          if [ "$COUNT" -gt 0 ] 2>/dev/null; then
            echo "posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "posted=false" >> "$GITHUB_OUTPUT"
            echo "::error::No review found for the reviewed commit $SHA — the reviewer reported success but nothing landed on the PR."
            exit 1
          fi

      # Stamp a DETERMINISTIC @agentproto-bot provenance footer (session id +
      # label, supervisor/parent session, adapter+auth, sandbox, cost/tokens,
      # run link, sha) onto the posted review. Runner-owned — never the model —
      # so the marker is a reliable native-vs-legacy discriminator. Cosmetic:
      # continue-on-error + the script never throws, so a bad stamp can't red a
      # green review. PROVENANCE is empty when the legacy fallback posted.
      - name: Stamp review provenance footer
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.bypass.outputs.skip != 'true' &&
          steps.verify.outputs.posted == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.setup.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.headsha.outputs.sha }}
          AUTH_MODE: ${{ steps.cliver.outputs.auth-mode }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          PROVENANCE: ${{ steps.reviewer-agentproto.outputs.provenance }}
        run: node scripts/stamp-review-footer.mjs

      # Gate: resolve decision + blocking config, post explicit statuses on
      # HEAD for both "Agentic review" and "Changeset present?" so the merge
      # gate is covered even when [skip ci] suppresses a new CI run.
      # Three steps so pr-fix (always()) still sees a red job and triggers.
      - name: Resolve review decision + blocking config
        id: gate
        if: steps.prstate.outputs.skip != 'true'
        run: |
          DECISION=$(gh pr view "$PR_NUMBER" --json reviewDecision -q '.reviewDecision')
          BLOCKING="${{ vars.AGENTIC_REVIEW_BLOCKING }}"
          if [ -z "$BLOCKING" ] && [ -f .github/agentic-review.json ]; then
            BLOCKING=$(node -p "String(require('./.github/agentic-review.json').blocking ?? '')" 2>/dev/null || echo "")
          fi
          [ -z "$BLOCKING" ] && BLOCKING="true"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
          # Honest gate, in precedence:
          #   bypassed            → success (local review vouched, reviewer skipped)
          #   reviewer didn't post → failure (no false green — the #72 bug)
          #   review row missing for reviewed SHA → failure (API-level proof,
          #     independent of the reviewer's own success report)
          #   CHANGES_REQUESTED + blocking → failure
          #   else                → success
          if [ "$BYPASS" = "true" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          elif [ "$REVIEWER_OUTCOME" != "success" ]; then
            echo "::error::Agentic reviewer did not post a review (outcome=$REVIEWER_OUTCOME)."
            echo "state=failure" >> "$GITHUB_OUTPUT"
          elif [ "$VERIFY_POSTED" != "true" ]; then
            echo "::error::Reviewer reported success but no review exists for the reviewed SHA (verify.posted=$VERIFY_POSTED) — refusing a false green."
            echo "state=failure" >> "$GITHUB_OUTPUT"
          elif [ "$BLOCKING" = "true" ] && [ "$DECISION" = "CHANGES_REQUESTED" ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BYPASS: ${{ steps.bypass.outputs.skip }}
          REVIEWER_OUTCOME: ${{ steps.reviewer.outputs.outcome }}
          VERIFY_POSTED: ${{ steps.verify.outputs.posted }}

      - name: Post explicit statuses on PR HEAD
        if: steps.prstate.outputs.skip != 'true'
        run: |
          SHA=$(git rev-parse HEAD)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # A transient GitHub 5xx on either POST used to fail the step outright,
          # which reds an already-APPROVED review and — worse — leaves the PR
          # half-statused (first context posted, second never), so the merge gate
          # blocks a PR that actually passed. Retry with backoff, and always
          # attempt both contexts before failing. Reposting is safe: statuses are
          # keyed by context and the latest one wins.
          post_status() {
            local context="$1" state="$2" description="$3" attempt out
            for attempt in 1 2 3; do
              if out=$(gh api "repos/${{ github.repository }}/statuses/$SHA" \
                  -f context="$context" \
                  -f state="$state" \
                  -f target_url="$RUN_URL" \
                  -f description="$description" 2>&1); then
                echo "posted '$context' = $state"
                return 0
              fi
              # Truncated: a 5xx body is a full HTML error page.
              echo "  attempt $attempt/3 failed for '$context': $(printf '%s' "$out" | tr '\n' ' ' | cut -c1-200)"
              if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
            done
            echo "::error::failed to post '$context' status after 3 attempts — merge gate may block until this run is re-run"
            return 1
          }
          rc=0
          post_status "Agentic review" \
            "${{ steps.gate.outputs.state }}" \
            "decision=${{ steps.gate.outputs.decision }} blocking=${{ steps.gate.outputs.blocking }}" || rc=1
          # Mirror "Changeset present?" so the merge gate stays green after a
          # [skip ci] changeset commit (which suppresses the changeset-check job).
          post_status "Changeset present?" "success" "written by agentic reviewer" || rc=1
          exit $rc
        env:
          # Commit statuses are checks, not authored content — no bot identity
          # to gain here. Keep the default GITHUB_TOKEN, which carries this
          # job's `statuses: write` permission. The App token would 403 unless
          # the App is granted "Commit statuses: write".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate — fail run if blocking changes requested
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.gate.outputs.state == 'failure'
        run: |
          echo "::error::Agentic reviewer requested changes (blocking mode) — merge blocked until fixes or admin force-merge."
          exit 1

  # On PRs: if pr-review posted CHANGES_REQUESTED, apply the fixes automatically.
  # Runs after pr-review; checks the live review decision before spending tokens.
  # The fix commit (no [skip ci]) re-triggers the full CI cycle, including pr-review,
  # creating the review-fix loop. Loop is bounded by MAX_ITER in apply-review.mjs.
  # always() is required so this job runs even when pr-review fails (gate step exits 1).
  pr-fix:
    name: Auto-fix from review
    runs-on: ubuntu-latest
    needs: [pr-review]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write        # commit + push fixes back to the branch
      pull-requests: write   # post escalation comment when loop is exhausted
    steps:
      - name: Check review decision
        id: decision
        run: |
          DECISION=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json reviewDecision -q '.reviewDecision')
          echo "Review decision: $DECISION"
          echo "value=$DECISION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v5 # bootstrap: load the local composite action
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
      - uses: ./.github/actions/agent-setup
        id: setup
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}
          pnpm: 'true'

      # The auto-fix loop is pinned to commit-mode (push onto the PR branch) so
      # the review→fix→re-review cycle stays tight. Stacked-PR delivery is an
      # on-demand choice via `/fix --pr` (config.fixDelivery sets that default).
      - name: Apply review fixes
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        run: node scripts/apply-review.mjs --delivery commit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # App token so any escalation comment is authored by the bot identity.
          GITHUB_TOKEN: ${{ steps.setup.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Commit and push fixes
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          BOT_SLUG: ${{ steps.setup.outputs.app-slug }}
        run: |
          bash scripts/configure-bot-git.sh
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit (loop exhausted — escalation was posted)."
          else
            ITER=$(git log --oneline --grep="auto-fix from review" origin/main..HEAD \
              | wc -l | tr -d ' ')
            NEXT=$((ITER + 1))
            git commit -m "chore: auto-fix from review (iter $NEXT)"
            git push
          fi

  # On PRs: once the agentic review APPROVES, optionally enable GitHub-native
  # auto-merge so the PR merges itself when all required checks pass. This is the
  # bot closing its own loop (open → review → fix → merge). Opt-in via
  # `vars.AGENTFLOW_AUTOMERGE=true` — the repo variable is the only thing that
  # can ENABLE auto-merge, because it lives in repo settings where a PR cannot
  # reach it. `merge.auto: false` in .github/agentic-review.json (read from the
  # base branch) can veto, but never enable. It is never armed on a draft PR —
  # that guard is a declared rule (job-level `if:` plus `merge-gate.mjs`), not
  # an accident of the GraphQL error GitHub returns when you try. "merge with
  # conditions" = GitHub's required checks (rulesets/branch protection) — we
  # only flip the auto switch.
  auto-merge:
    name: Auto-merge (opt-in)
    runs-on: ubuntu-latest
    needs: [build-and-test, pr-review]
    # Declared draft guard: "draft ⇒ don't arm" is a job-level rule, not an
    # accident of the GraphQL error GitHub returns when arming a draft PR (the
    # failure that was previously swallowed by `|| echo ::warning` further
    # down). merge-gate.mjs also refuses on draft — this skips the job outright
    # so a draft never even reaches that check.
    #
    # Declared green guard: `always()` is here so a *skipped* pr-review (the
    # normal path once a PR is already approved) still reaches the gate — but
    # it equally defeats the needs-failure skip, so a RED build reached it too.
    # The arming step below delegates "wait for green" to GitHub, on the
    # premise that required checks hold the merge. `main` has no branch
    # protection and no required checks, so that premise is empty: arming *is*
    # merging. #379 merged with Build + test red for exactly this reason, and
    # took the Release job down with it. Name the dependency here instead of
    # inferring it from pr-review's own needs — pr-review skips for reasons of
    # its own, and a skip must not read as a pass.
    if: |
      always() &&
      needs.build-and-test.result == 'success' &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5 # bootstrap: load the local composite action

      # The re-triggered run (from the reviewer's changeset commit) can race
      # GitHub auto-merge, which merges the PR and deletes its branch. Every
      # branch-dependent step below then fails on a dead-branch checkout
      # (`agent-setup` does `ref: github.head_ref`). Query the LIVE PR state
      # here — the bootstrap checkout above works post-merge and this `gh`
      # call needs no branch — and skip the rest of the job if it's gone.
      - name: Skip if PR already merged/closed
        id: prstate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MERGED=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" --json state,mergedAt \
            --jq 'if (.mergedAt != null) or (.state != "OPEN") then "true" else "false" end')
          echo "skip=$MERGED" >> "$GITHUB_OUTPUT"
          if [ "$MERGED" = "true" ]; then echo "PR no longer open — skipping branch-dependent steps."; fi

      - uses: ./.github/actions/agent-setup
        id: setup
        if: steps.prstate.outputs.skip != 'true'
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          fallback-token: ${{ secrets.GITHUB_TOKEN }}

      # Deterministic half of the decision (draft / var-enables / file-vetoes /
      # self-modification / approval / ack) — scripts/agentflow/merge-gate.mjs,
      # a pure + conformance-tested function. This step is a thin caller: it
      # must never re-implement that logic here. Reads the policy from the base
      # branch (never the PR's own tree — a PR gets no vote on how it is
      # merged) and pins it to /tmp/merge-policy.json for the maintainer step.
      - name: Compute merge-gate decision
        id: gate
        if: steps.prstate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.base_ref }}
          VAR_AUTOMERGE: ${{ vars.AGENTFLOW_AUTOMERGE }}
        run: |
          VERDICT=$(node scripts/agentflow/merge-gate.mjs)
          ACTION=$(printf '%s' "$VERDICT" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).action}catch{'hold'}")
          REASON=$(printf '%s' "$VERDICT" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).reason}catch{'merge-gate output unreadable'}")
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          # Heredoc form, not a plain KEY=value line: `reason` can echo back a
          # changed filename from the PR branch, which must not be treated as
          # shell-significant when this output is later consumed.
          {
            echo "reason<<MERGE_GATE_REASON_EOF"
            echo "$REASON"
            echo "MERGE_GATE_REASON_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Hold / disabled — no action
        if: |
          steps.prstate.outputs.skip != 'true' &&
          (steps.gate.outputs.action == 'hold' || steps.gate.outputs.action == 'disabled')
        # ACTION/REASON via env, not inline `${{ }}` — reason can echo back a
        # changed filename from the PR branch (see the changeset-check step's
        # comment on why `${{ }}` interpolation into shell text is unsafe).
        env:
          ACTION: ${{ steps.gate.outputs.action }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          echo "merge-gate: $ACTION — $REASON"

      # Self-modification guard: a PR touching the merge machinery cannot be
      # trusted to judge itself. See merge-gate.mjs's SELF_MODIFICATION_RE.
      - name: Escalate to a human
        id: escalate
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.gate.outputs.action == 'escalate'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REASON: ${{ steps.gate.outputs.reason }}
        run: |
          cfg() { node -p "String((require('/tmp/merge-policy.json').merge||{}).$1 ?? '')" 2>/dev/null || echo ""; }
          ESC_TO=$(cfg escalateTo); [ -z "$ESC_TO" ] && ESC_TO="agentiknet"
          echo "merge-gate escalated — handing off to @$ESC_TO. Reason: $REASON"
          gh pr comment "$PR" --repo "$REPO" --body "🛑 Auto-merge withheld — this PR modifies the auto-merge machinery itself, so the machinery is not judging it. @$ESC_TO please review. Reason: $REASON"
          gh pr edit "$PR" --repo "$REPO" --add-label "needs-human-review" 2>/dev/null || true

      # Maintainer layer (optional, on top of the deterministic gate): once
      # merge-gate clears a PR to arm, a judge decides merge vs
      # escalate-to-human for anything it still finds too risky. Only reached
      # when merge-gate's action is "arm" — never on hold/disabled/escalate.
      - name: Maintainer judgment + arm
        if: |
          steps.prstate.outputs.skip != 'true' &&
          steps.gate.outputs.action == 'arm'
        env:
          GH_TOKEN: ${{ steps.setup.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # /tmp/merge-policy.json was written by the "Compute merge-gate
          # decision" step above (base-branch-pinned) — reuse it rather than
          # re-fetching, and pass the same pin to the maintainer via
          # AGENTFLOW_POLICY_FILE so it never falls back to reading the PR's
          # own copy (which is exactly the hole this PR-cannot-judge-itself
          # design closes).
          cfg() { node -p "String((require('/tmp/merge-policy.json').merge||{}).$1 ?? '')" 2>/dev/null || echo ""; }
          METHOD=$(cfg method); MAINT=$(cfg maintainer); ESC_TO=$(cfg escalateTo)
          [ -z "$METHOD" ] && METHOD="squash"
          [ -z "$ESC_TO" ] && ESC_TO="agentiknet"

          if [ "$MAINT" = "true" ]; then
            VERDICT=$(AGENTFLOW_POLICY_FILE=/tmp/merge-policy.json node scripts/maintainer.mjs) || true
            MDEC=$(printf '%s' "$VERDICT" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).decision}catch{'escalate'}")
            MWHY=$(printf '%s' "$VERDICT" | node -pe "try{JSON.parse(require('fs').readFileSync(0,'utf8')).reason}catch{'maintainer output unreadable'}")
            if [ "$MDEC" != "merge" ]; then
              echo "Maintainer escalated — handing off to @$ESC_TO."
              gh pr comment "$PR" --repo "$REPO" --body "🛑 Auto-merge withheld by the maintainer — @$ESC_TO please review. Reason: $MWHY"
              gh pr edit "$PR" --repo "$REPO" --add-label "needs-human-review" 2>/dev/null || true
              exit 0
            fi
            echo "Maintainer cleared the PR ($MWHY) — arming auto-merge."
          fi

          # Flip GitHub-native auto-merge: GitHub performs the merge once every
          # REQUIRED check passes (the conditions live in branch protection /
          # rulesets, not here). merge-gate already established that arming is
          # *expected* to succeed here — a failure at this point is anomalous
          # and must not be swallowed (2026-07-15's incident was exactly a
          # swallowed failure of this call on a draft PR).
          echo "Enabling auto-merge (method=$METHOD) on #$PR…"
          if ! gh pr merge "$PR" --repo "$REPO" --auto --"$METHOD" --delete-branch; then
            echo "::error::merge-gate said arm, but 'gh pr merge --auto' failed — ensure 'Allow auto-merge' is enabled in repo settings and required checks exist. This is not expected to fail once merge-gate clears a PR; treat as a real failure, not a no-op."
            exit 1
          fi

