name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first — `tsc --noEmit` resolves workspace package imports
      # through their published `.d.ts` files in `dist/`, which only
      # exist after `pnpm build`. Running `check-types` before `build`
      # produced "Cannot find module '@agentproto/<pkg>'" cascades on
      # every commit since the multi-package extraction.
      - name: Build all packages
        run: pnpm build

      - name: Type-check all packages
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

  # On PRs: verify a changeset was added. Quick git-only check that
  # runs in parallel with build-and-test to give fast feedback.
  # If the changeset is missing, auto-changeset (below) will generate
  # one after the build passes — a new CI run then makes this pass.
  changeset-check:
    name: Changeset present?
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" == chore\(release\):* ]]; then
            echo "Version Packages PR — no changeset required."
            exit 0
          fi
          ADDED=$(git diff --diff-filter=A --name-only origin/main...HEAD -- '.changeset/*.md' \
            | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$ADDED" ]; then
            echo "No changeset found. Run 'pnpm changeset' or wait for auto-changeset to generate one."
            exit 1
          fi
          echo "✓ Changeset present: $ADDED"

  # On PRs: auto-generate a changeset via Claude if one is missing.
  # Only runs AFTER build-and-test passes — no point generating a
  # changeset for a broken build, and avoids wasting API tokens.
  # Commits the generated file back to the branch, which triggers a
  # new CI run where changeset-check then passes.
  # On PRs: agentic reviewer — reads the full diff, greps the codebase,
  # writes an accurate changeset, and posts a structured review.
  # Runs after build-and-test so it never reviews a broken build.
  # Replaces auto-changeset when present: the reviewer writes the
  # changeset AND posts the review in one pass.
  pr-review:
    name: Agentic review
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write       # push generated changeset back to the branch
      pull-requests: write  # post review + comments
    steps:
      - name: Checkout branch (with write token)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run agentic PR reviewer
        run: node scripts/review-pr.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Commit changeset (if written by reviewer)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '.changeset/*.md'
          if git diff --cached --quiet; then
            echo "No changeset changes to commit."
          else
            git commit -m "chore: agentic reviewer — write/update changeset [skip ci]"
            git push
          fi

      # Gate: fail the job (red check) when the reviewer posted CHANGES_REQUESTED.
      # Runs after the changeset is committed so the push still lands before the
      # job turns red. pr-fix (below) uses always() so it still runs to apply fixes.
      - name: Gate — fail if changes requested
        run: |
          DECISION=$(gh pr view "$PR_NUMBER" --json reviewDecision -q '.reviewDecision')
          echo "Review decision: $DECISION"
          if [ "$DECISION" = "CHANGES_REQUESTED" ]; then
            echo "::error::Agentic reviewer requested changes — PR is blocked until fixes are applied or a human admin force-merges."
            exit 1
          fi
          echo "✅ Review decision: $DECISION — merge gate open."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # On PRs: if pr-review posted CHANGES_REQUESTED, apply the fixes automatically.
  # Runs after pr-review; checks the live review decision before spending tokens.
  # The fix commit (no [skip ci]) re-triggers the full CI cycle, including pr-review,
  # creating the review-fix loop. Loop is bounded by MAX_ITER in apply-review.mjs.
  # always() is required so this job runs even when pr-review fails (gate step exits 1).
  pr-fix:
    name: Auto-fix from review
    runs-on: ubuntu-latest
    needs: [pr-review]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write        # commit + push fixes back to the branch
      pull-requests: write   # post escalation comment when loop is exhausted
    steps:
      - name: Check review decision
        id: decision
        run: |
          DECISION=$(gh pr view "${{ github.event.pull_request.number }}" \
            --json reviewDecision -q '.reviewDecision')
          echo "Review decision: $DECISION"
          echo "value=$DECISION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout branch (with write token)
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply review fixes
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        run: node scripts/apply-review.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Commit and push fixes
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit (loop exhausted — escalation was posted)."
          else
            ITER=$(git log --oneline --grep="auto-fix from review" origin/main..HEAD \
              | wc -l | tr -d ' ')
            NEXT=$((ITER + 1))
            git commit -m "chore: auto-fix from review (iter $NEXT)"
            git push
          fi

  auto-changeset:
    name: Generate changeset
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write   # push generated changeset back to the branch
    steps:
      - name: Checkout branch (with write token)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if changeset already exists
        id: check
        run: |
          ADDED=$(git diff --diff-filter=A --name-only origin/main...HEAD -- '.changeset/*.md' \
            | grep -v '^\.changeset/README\.md$' || true)
          if [ -n "$ADDED" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✓ Changeset already present: $ADDED"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No changeset found — will auto-generate."
          fi

      - name: Setup pnpm
        if: steps.check.outputs.present == 'false'
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        if: steps.check.outputs.present == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate changeset via Claude
        if: steps.check.outputs.present == 'false'
        run: node scripts/auto-changeset.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit generated changeset
        if: steps.check.outputs.present == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add '.changeset/*.md'
          if git diff --cached --quiet; then
            echo "Nothing to commit (no packages changed, changeset not needed)."
          else
            git commit -m "chore: auto-generate changeset [skip ci]"
            git push
          fi
