name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first — `tsc --noEmit` resolves workspace package imports
      # through their published `.d.ts` files in `dist/`, which only
      # exist after `pnpm build`. Running `check-types` before `build`
      # produced "Cannot find module '@agentproto/<pkg>'" cascades on
      # every commit since the multi-package extraction.
      - name: Build all packages
        run: pnpm build

      - name: Type-check all packages
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

  # On PRs: verify a changeset was added (or the author opted out with
  # the "skip changeset" label). This prevents "Version Packages" PRs
  # from accidentally shipping without changelog entries.
  changeset-check:
    name: Changeset present?
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for changeset
        # Uses git directly — avoids fragile `changeset status` exit codes.
        # Passes when a .changeset/*.md file (not README) was added in this
        # branch, or when the PR title starts with "chore(release):" (the
        # "Version Packages" PR opened by changesets/action itself).
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" == chore\(release\):* ]]; then
            echo "Version Packages PR — no changeset required."
            exit 0
          fi
          ADDED=$(git diff --diff-filter=A --name-only origin/main...HEAD -- '.changeset/*.md' \
            | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$ADDED" ]; then
            echo "No changeset found. Run 'pnpm changeset' and commit the .changeset/*.md file."
            exit 1
          fi
          echo "✓ Changeset present: $ADDED"
