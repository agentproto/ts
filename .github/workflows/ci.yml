name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first — `tsc --noEmit` resolves workspace package imports
      # through their published `.d.ts` files in `dist/`, which only
      # exist after `pnpm build`. Running `check-types` before `build`
      # produced "Cannot find module '@agentproto/<pkg>'" cascades on
      # every commit since the multi-package extraction.
      - name: Build all packages
        run: pnpm build

      - name: Type-check all packages
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

  # On PRs: verify a changeset was added. Quick git-only check that
  # runs in parallel with build-and-test to give fast feedback.
  # If the changeset is missing, pr-review will generate one after
  # build-and-test passes — its commit re-triggers CI, making this pass.
  changeset-check:
    name: Changeset present?
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for changeset
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" == chore\(release\):* ]]; then
            echo "Version Packages PR — no changeset required."
            exit 0
          fi
          # A changeset is only required when a publishable package changed.
          # PRs that touch only scripts/, .github/, root configs, etc. ship no
          # npm version bump — mirror the reviewer's rule and skip the gate so
          # these don't show a (non-blocking but ugly) red check.
          PKG_CHANGES=$(git diff --name-only origin/main...HEAD -- 'packages/**' 'adapters/**' || true)
          if [ -z "$PKG_CHANGES" ]; then
            echo "No @agentproto/* package changes — no changeset required."
            exit 0
          fi
          ADDED=$(git diff --diff-filter=A --name-only origin/main...HEAD -- '.changeset/*.md' \
            | grep -v '^\.changeset/README\.md$' || true)
          if [ -z "$ADDED" ]; then
            echo "Package changes present but no changeset. Run 'pnpm changeset' / 'pnpm changeset:ai', or wait for pr-review to generate one."
            exit 1
          fi
          echo "✓ Changeset present: $ADDED"

  # On PR open: fill an empty description from the diff (never clobbers a
  # human/agent-written body). Opt-in via describe.auto in agentic-review.json.
  describe:
    name: Describe PR
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'reopened') &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Fill PR description (if empty + enabled)
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          AUTO=$(node -p "String((require('./.github/agentic-review.json').describe||{}).auto ?? '')" 2>/dev/null || echo "")
          if [ "$AUTO" != "true" ]; then echo "describe.auto is off — skipping."; exit 0; fi
          git fetch --quiet origin main || true
          node scripts/describe-pr.mjs --pr "$PR_NUMBER"

  # On PRs: agentic reviewer — reads the full diff, greps the codebase,
  # writes an accurate changeset, and posts a structured review.
  # Runs after build-and-test so it never reviews a broken build.
  # The reviewer writes the changeset; the changeset commit re-triggers CI
  # so the "Agentic review" check lands on the new HEAD (Part A makes that
  # re-run idempotent — no second changeset commit is produced).
  pr-review:
    name: Agentic review
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: |
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write       # push generated changeset back to the branch
      pull-requests: write  # post review + comments
      statuses: write       # post explicit commit-status on HEAD after push
    steps:
      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout branch (with write token)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.bot.outputs.token || secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # agentflow bypass: if the dev ran `review:ai --stamp` locally, an
      # empty `[agentflow-reviewed]` marker commit rides the branch. Honor it
      # and skip the cloud reviewer (the dev vouched + ran local changeset).
      # Trust note: any commit in-range can carry the marker, so this is a
      # convenience for trusted contributors, not a security boundary.
      - name: Check local-review bypass
        id: bypass
        run: |
          # Ensure origin/main is present so the range resolves (checkout is
          # fetch-depth:0, but make the tracking ref explicit). Fail-safe: if
          # the range can't resolve, skip stays false and the cloud reviewer runs.
          git fetch --quiet origin main || true
          if git log origin/main..HEAD --format='%B' | grep -qF '[agentflow-reviewed]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Local-review marker found — skipping the cloud reviewer."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agentic PR reviewer
        id: reviewer
        if: steps.bypass.outputs.skip != 'true'
        # Don't abort the job on a non-posting reviewer — capture the outcome so
        # the gate can turn it into an honest red instead of a false green.
        continue-on-error: true
        run: node scripts/review-pr.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Use the App token so the review + comments are authored by the
          # bot identity (mentionable) instead of github-actions[bot].
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Commit changeset (if written by reviewer)
        if: steps.bypass.outputs.skip != 'true'
        id: changeset
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          # Attribute the commit to the App bot (mentionable identity) when an
          # App token was minted; fall back to github-actions[bot] otherwise.
          bash scripts/configure-bot-git.sh
          git add '.changeset/*.md'
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changeset changes to commit."
          else
            # [skip ci] prevents a redundant build cycle — explicit statuses
            # below cover both "Agentic review" and "Changeset present?" on
            # the new HEAD, so the merge gate stays green without a second run.
            git commit -m "chore: agentic reviewer — changeset [skip ci]"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # Gate: resolve decision + blocking config, post explicit statuses on
      # HEAD for both "Agentic review" and "Changeset present?" so the merge
      # gate is covered even when [skip ci] suppresses a new CI run.
      # Three steps so pr-fix (always()) still sees a red job and triggers.
      - name: Resolve review decision + blocking config
        id: gate
        run: |
          DECISION=$(gh pr view "$PR_NUMBER" --json reviewDecision -q '.reviewDecision')
          BLOCKING="${{ vars.AGENTIC_REVIEW_BLOCKING }}"
          if [ -z "$BLOCKING" ] && [ -f .github/agentic-review.json ]; then
            BLOCKING=$(node -p "String(require('./.github/agentic-review.json').blocking ?? '')" 2>/dev/null || echo "")
          fi
          [ -z "$BLOCKING" ] && BLOCKING="true"
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "blocking=$BLOCKING" >> "$GITHUB_OUTPUT"
          # Honest gate, in precedence:
          #   bypassed            → success (local review vouched, reviewer skipped)
          #   reviewer didn't post → failure (no false green — the #72 bug)
          #   CHANGES_REQUESTED + blocking → failure
          #   else                → success
          if [ "$BYPASS" = "true" ]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          elif [ "$REVIEWER_OUTCOME" != "success" ]; then
            echo "::error::Agentic reviewer did not post a review (outcome=$REVIEWER_OUTCOME)."
            echo "state=failure" >> "$GITHUB_OUTPUT"
          elif [ "$BLOCKING" = "true" ] && [ "$DECISION" = "CHANGES_REQUESTED" ]; then
            echo "state=failure" >> "$GITHUB_OUTPUT"
          else
            echo "state=success" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BYPASS: ${{ steps.bypass.outputs.skip }}
          REVIEWER_OUTCOME: ${{ steps.reviewer.outcome }}

      - name: Post explicit statuses on PR HEAD
        run: |
          SHA=$(git rev-parse HEAD)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f context="Agentic review" \
            -f state="${{ steps.gate.outputs.state }}" \
            -f target_url="$RUN_URL" \
            -f description="decision=${{ steps.gate.outputs.decision }} blocking=${{ steps.gate.outputs.blocking }}"
          # Mirror "Changeset present?" so the merge gate stays green after a
          # [skip ci] changeset commit (which suppresses the changeset-check job).
          gh api "repos/${{ github.repository }}/statuses/$SHA" \
            -f context="Changeset present?" \
            -f state="success" \
            -f target_url="$RUN_URL" \
            -f description="written by agentic reviewer"
        env:
          # Commit statuses are checks, not authored content — no bot identity
          # to gain here. Keep the default GITHUB_TOKEN, which carries this
          # job's `statuses: write` permission. The App token would 403 unless
          # the App is granted "Commit statuses: write".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate — fail run if blocking changes requested
        if: steps.gate.outputs.state == 'failure'
        run: |
          echo "::error::Agentic reviewer requested changes (blocking mode) — merge blocked until fixes or admin force-merge."
          exit 1

  # On PRs: if pr-review posted CHANGES_REQUESTED, apply the fixes automatically.
  # Runs after pr-review; checks the live review decision before spending tokens.
  # The fix commit (no [skip ci]) re-triggers the full CI cycle, including pr-review,
  # creating the review-fix loop. Loop is bounded by MAX_ITER in apply-review.mjs.
  # always() is required so this job runs even when pr-review fails (gate step exits 1).
  pr-fix:
    name: Auto-fix from review
    runs-on: ubuntu-latest
    needs: [pr-review]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write        # commit + push fixes back to the branch
      pull-requests: write   # post escalation comment when loop is exhausted
    steps:
      - name: Check review decision
        id: decision
        run: |
          DECISION=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json reviewDecision -q '.reviewDecision')
          echo "Review decision: $DECISION"
          echo "value=$DECISION" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED' && vars.BOT_APP_ID != ''
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout branch (with write token)
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ steps.bot.outputs.token || secrets.BOT_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: pnpm/action-setup@v6
        # version read from packageManager field in package.json

      - name: Setup Node.js
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # The auto-fix loop is pinned to commit-mode (push onto the PR branch) so
      # the review→fix→re-review cycle stays tight. Stacked-PR delivery is an
      # on-demand choice via `/fix --pr` (config.fixDelivery sets that default).
      - name: Apply review fixes
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        run: node scripts/apply-review.mjs --delivery commit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # App token so any escalation comment is authored by the bot identity.
          GITHUB_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - name: Commit and push fixes
        if: steps.decision.outputs.value == 'CHANGES_REQUESTED'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
        run: |
          bash scripts/configure-bot-git.sh
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes to commit (loop exhausted — escalation was posted)."
          else
            ITER=$(git log --oneline --grep="auto-fix from review" origin/main..HEAD \
              | wc -l | tr -d ' ')
            NEXT=$((ITER + 1))
            git commit -m "chore: auto-fix from review (iter $NEXT)"
            git push
          fi

  # On PRs: once the agentic review APPROVES, optionally enable GitHub-native
  # auto-merge so the PR merges itself when all required checks pass. This is the
  # bot closing its own loop (open → review → fix → merge). OFF by default: it
  # only acts when opted in via `vars.AGENTFLOW_AUTOMERGE=true` or `merge.auto`
  # in .github/agentic-review.json. "merge with conditions" = GitHub's required
  # checks (rulesets/branch protection) — we only flip the auto switch.
  auto-merge:
    name: Auto-merge (opt-in)
    runs-on: ubuntu-latest
    needs: [pr-review]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.title, 'chore(release):')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Mint bot token (GitHub App — optional)
        id: bot
        if: ${{ vars.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout (read merge config)
        uses: actions/checkout@v5

      - name: Enable auto-merge when approved + opted-in
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          VAR_AUTOMERGE: ${{ vars.AGENTFLOW_AUTOMERGE }}
        run: |
          cfg() { node -p "String((require('./.github/agentic-review.json').merge||{}).$1 ?? '')" 2>/dev/null || echo ""; }
          AUTO=$(cfg auto); METHOD=$(cfg method); REQ_ACK=$(cfg requireAck); ACK_LABEL=$(cfg ackLabel)
          [ -z "$METHOD" ] && METHOD="squash"
          [ -z "$ACK_LABEL" ] && ACK_LABEL="agentflow:ack"

          # Master switch — OFF unless the repo var OR config opts in.
          if [ "$VAR_AUTOMERGE" != "true" ] && [ "$AUTO" != "true" ]; then
            echo "auto-merge disabled — set vars.AGENTFLOW_AUTOMERGE=true or merge.auto in .github/agentic-review.json. Skipping."
            exit 0
          fi

          # Condition 1: the agentic review must be APPROVED.
          DECISION=$(gh pr view "$PR" --repo "$REPO" --json reviewDecision -q '.reviewDecision')
          if [ "$DECISION" != "APPROVED" ]; then
            echo "review decision is '$DECISION' (need APPROVED) — not enabling auto-merge."
            exit 0
          fi

          # Condition 2 (optional): a human ack label must be present.
          if [ "$REQ_ACK" = "true" ]; then
            if ! gh pr view "$PR" --repo "$REPO" --json labels -q '.labels[].name' | grep -qx "$ACK_LABEL"; then
              echo "requireAck is on and label '$ACK_LABEL' is absent — waiting for a dev ack."
              exit 0
            fi
          fi

          # Flip GitHub-native auto-merge: GitHub performs the merge once every
          # REQUIRED check passes (the conditions live in branch protection /
          # rulesets, not here).
          echo "Enabling auto-merge (method=$METHOD) on #$PR…"
          gh pr merge "$PR" --repo "$REPO" --auto --"$METHOD" --delete-branch \
            || echo "::warning::Could not enable auto-merge — ensure 'Allow auto-merge' is enabled in repo settings and required checks exist."

