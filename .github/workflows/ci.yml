name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-test:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # version read from packageManager field in package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first — `tsc --noEmit` resolves workspace package imports
      # through their published `.d.ts` files in `dist/`, which only
      # exist after `pnpm build`. Running `check-types` before `build`
      # produced "Cannot find module '@agentproto/<pkg>'" cascades on
      # every commit since the multi-package extraction.
      - name: Build all packages
        run: pnpm build

      - name: Type-check all packages
        run: pnpm check-types

      - name: Run tests
        run: pnpm test

  # On PRs: verify a changeset was added (or the author opted out with
  # the "skip changeset" label). This prevents "Version Packages" PRs
  # from accidentally shipping without changelog entries.
  changeset-check:
    name: Changeset present?
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changeset
        # Passes when the PR already has a .changeset/*.md file, or when
        # the PR title starts with "chore(release):" (the "Version Packages"
        # PR opened by changesets/action itself).
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" == chore\(release\):* ]]; then
            echo "Version Packages PR — no changeset required."
            exit 0
          fi
          pnpm changeset status --since=origin/main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
