# First/beta rail for the desktop app: builds ad-hoc-signed, un-notarized
# installers for macOS, Linux, and Windows and attaches them to a DRAFT
# GitHub Release for a human to review and publish.
#
# macOS is ad-hoc signed via bundle.macOS.signingIdentity "-" in
# tauri.conf.json. This is NOT a paid Developer ID signature — it does not
# clear Gatekeeper on its own — but it produces a *sealed* signature (binds
# Info.plist + seals resources) instead of Tauri's default linker-only
# ad-hoc signature. Without it, Gatekeeper's assessment errors out
# ("internal error in Code Signing subsystem") and even the right-click →
# Open / "Open Anyway" workaround fails. With it, that workaround works.
#
# No auto-updater plugin is configured for packages/desktop, so there is no
# TAURI_SIGNING_* key involved and no APPLE_* notarization env is set up
# here. macOS Gatekeeper and Windows SmartScreen still warn on first launch
# — see the release notes below for the workaround users need. Developer ID
# signing + notarization is a later hardening step, not a blocker for
# shipping the first installers.
#
# Distribution is a GitHub Release, not npm — packages/desktop is private.

name: Desktop app release

on:
  workflow_dispatch: # manual (re)run, e.g. to test this workflow
  push:
    tags:
      - 'desktop-v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm

      # Tauri's beforeBuildCommand runs `pnpm build` inside packages/desktop,
      # which needs the workspace's deps installed at the repo root first.
      - name: Install dependencies
        run: pnpm install

      - name: Build and release the desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: packages/desktop
          tagName: desktop-v__VERSION__
          releaseName: 'agentproto desktop v__VERSION__'
          releaseBody: |
            These installers are ad-hoc signed but NOT notarized (first/beta rail — no Apple Developer ID key is configured yet):

            - **macOS**: drag `agentproto.app` into your Applications folder, then open System Settings → Privacy & Security → "Open Anyway" (on older macOS, right-click the app → Open). If it still refuses to launch, strip the download quarantine flag first:
              ```
              xattr -dr com.apple.quarantine /Applications/agentproto.app
              ```
            - **Windows**: click "More info" → "Run anyway" to get past SmartScreen.
            - **Linux**: runs directly, no extra step needed.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
